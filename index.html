<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D1117">
<link rel="manifest" href="manifest.json">
<title>CFD Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0D1117;--bg2:#161B22;--card:#1C2333;
  --b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
  --tx:#E6EDF3;--mu:#8B949E;--fa:#484F58;
  --gold:#F59E0B;--gd:rgba(245,158,11,.13);--gb:rgba(245,158,11,.35);
  --up:#3FB950;--dn:#F85149;--bl:#58A6FF;
  --HDR:50px;--NAV:56px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-size:14px;}
/* 헤더 */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--HDR);z-index:100;
  background:rgba(13,17,23,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--b2);display:flex;align-items:center;padding:0 14px;gap:9px;}
#hdr-ico{width:28px;height:28px;border-radius:7px;background:var(--gd);
  border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;font-size:16px;}
#hdr-info{flex:1;min-width:0;}
#hdr-title{font-size:14px;font-weight:500;}
#hdr-sub{font-size:10px;color:var(--mu);margin-top:1px;}
#hdr-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--b2);
  background:var(--bg2);color:var(--mu);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
#hdr-btn.spin{animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
/* 탭 */
.wrap{position:fixed;top:var(--HDR);left:0;right:0;bottom:var(--NAV);overflow:hidden;}
.pane{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;display:none;
  -webkit-overflow-scrolling:touch;}
.pane.on{display:block;}
/* 네비 */
#nav{position:fixed;bottom:0;left:0;right:0;height:var(--NAV);z-index:999;
  background:rgba(13,17,23,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--b2);display:flex;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border:none;background:transparent;color:var(--mu);
  font-size:9px;font-weight:500;cursor:pointer;font-family:inherit;padding:4px 0;}
.nb.on{color:var(--gold);}
.nb-i{font-size:20px;line-height:1.1;}
/* 배너 */
.banner{background:var(--gd);border:1px solid var(--gb);border-radius:11px;
  margin:10px 12px 6px;padding:10px 13px;display:flex;gap:8px;align-items:flex-start;
  font-size:12px;line-height:1.6;}
/* 트리 */
.tree-hint{font-size:10px;color:var(--fa);padding:3px 12px 2px;text-align:center;}
#tree-scroll{overflow-x:scroll;overflow-y:visible;display:flex;gap:0;
  padding:8px 8px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
#tree-scroll::-webkit-scrollbar{display:none;}
.lv-col{flex-shrink:0;display:flex;flex-direction:column;gap:4px;}
.lv-hdr{font-size:8px;font-weight:600;text-align:center;padding:2px 5px;
  border-radius:5px;margin-bottom:2px;white-space:nowrap;}
.nd{display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 3px;border-radius:9px;cursor:pointer;width:46px;position:relative;}
.nd.sel{background:rgba(245,158,11,.12);outline:1.5px solid var(--gold);}
.nd-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:19px;border:1px solid transparent;position:relative;}
.nd-lbl{font-size:7px;font-weight:500;text-align:center;line-height:1.2;max-width:46px;}
.nd-val{font-size:7px;font-family:monospace;text-align:center;}
.nd-cnt{position:absolute;top:-3px;right:-3px;width:13px;height:13px;
  border-radius:50%;background:var(--bg);border:1px solid rgba(255,255,255,.18);
  font-size:7px;color:var(--mu);display:flex;align-items:center;justify-content:center;}
.lv-gap{flex-shrink:0;width:20px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;padding-top:26px;gap:8px;}
/* 선택 패널 */
#sel-panel{position:fixed;bottom:var(--NAV);left:0;right:0;z-index:500;
  background:rgba(18,23,32,.97);backdrop-filter:blur(12px);
  border-top:1.5px solid rgba(245,158,11,.4);border-radius:16px 16px 0 0;
  padding:0;max-height:48vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
#sel-panel.show{transform:translateY(0);}
#sel-topbar{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 6px;position:sticky;top:0;background:rgba(18,23,32,.98);}
#sel-drag{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);}
#sel-close{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:var(--mu);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
#sel-inner{padding:8px 14px 16px;}
#sel-name{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:6px;}
#sel-val{font-size:12px;color:var(--mu);margin-bottom:8px;}
.sel-label{font-size:10px;color:var(--mu);margin-bottom:4px;}
#sel-chain{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:7px;
  padding:7px 9px;background:rgba(255,255,255,.04);border-radius:8px;}
.sc-n{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:500;cursor:pointer;}
.sc-a{font-size:10px;color:var(--fa);}
#sel-impact{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.si{border-radius:7px;padding:7px 9px;font-size:11px;line-height:1.55;}
.si-b{background:rgba(63,185,80,.1);color:var(--up);}
.si-s{background:rgba(248,81,73,.1);color:var(--dn);}
/* 용어사전 */
.g-search-wrap{padding:8px 12px 5px;}
.g-search{background:var(--card);border:1px solid var(--b2);border-radius:9px;
  padding:7px 11px;display:flex;align-items:center;gap:7px;}
.g-search input{flex:1;background:transparent;border:none;outline:none;
  color:var(--tx);font-size:13px;font-family:inherit;}
.g-search input::placeholder{color:var(--fa);}
.g-cats{display:flex;gap:5px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none;}
.g-cats::-webkit-scrollbar{display:none;}
.g-cat{font-size:10px;padding:4px 11px;border-radius:14px;
  border:1px solid var(--b2);color:var(--mu);white-space:nowrap;
  flex-shrink:0;cursor:pointer;background:transparent;font-family:inherit;}
.g-cat.on{background:var(--gd);border-color:var(--gb);color:var(--gold);}
.g-item{padding:11px 12px;border-bottom:1px solid var(--b);cursor:pointer;}
.g-top{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.g-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;}
.g-name{font-size:13px;font-weight:500;color:var(--tx);flex:1;}
.g-badge{font-size:9px;padding:2px 7px;border-radius:8px;background:var(--b2);color:var(--mu);}
.g-val{font-size:10px;font-family:monospace;margin-left:4px;}
.g-body{display:none;padding-top:6px;}
.g-body.on{display:block;}
.g-desc{font-size:12px;color:var(--mu);line-height:1.65;margin-bottom:7px;margin-left:37px;}
.g-info{font-size:10px;color:var(--fa);margin-bottom:6px;margin-left:37px;}
.g-impacts{margin-left:37px;display:flex;flex-direction:column;gap:4px;}
.g-bull{font-size:11px;padding:5px 9px;border-radius:6px;
  background:rgba(63,185,80,.1);color:var(--up);line-height:1.5;}
.g-bear{font-size:11px;padding:5px 9px;border-radius:6px;
  background:rgba(248,81,73,.1);color:var(--dn);line-height:1.5;}
/* 뉴스 */
.n-filterbar{display:flex;gap:5px;padding:8px 12px 4px;overflow-x:auto;scrollbar-width:none;}
.n-filterbar::-webkit-scrollbar{display:none;}
.n-fbtn{font-size:10px;padding:4px 11px;border-radius:14px;border:1px solid var(--b2);
  color:var(--mu);white-space:nowrap;flex-shrink:0;cursor:pointer;
  background:transparent;font-family:inherit;}
.n-fbtn.on{background:var(--gd);border-color:var(--gb);color:var(--gold);}
.n-cnt{font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(255,255,255,.1);margin-left:3px;}
.n-tagbar{display:flex;gap:4px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none;}
.n-tagbar::-webkit-scrollbar{display:none;}
.n-tag-btn{font-size:10px;padding:3px 9px;border-radius:10px;border:1px solid var(--b);
  color:var(--mu);white-space:nowrap;flex-shrink:0;cursor:pointer;background:var(--bg2);font-family:inherit;}
.n-tag-btn.on{background:var(--card);border-color:var(--b2);color:var(--tx);}
.n-divider{font-size:10px;color:var(--mu);padding:6px 12px 3px;
  border-top:1px solid var(--b);margin-top:2px;}
.n-row{display:flex;align-items:flex-start;padding:11px 12px;
  border-bottom:1px solid var(--b);cursor:pointer;gap:8px;
  transition:background .12s;}
.n-row.read{opacity:.5;}
.n-status{width:18px;flex-shrink:0;padding-top:3px;}
.n-dot{width:7px;height:7px;border-radius:50%;background:var(--bl);}
.n-star-ico{font-size:12px;color:var(--gold);}
.n-body{flex:1;min-width:0;}
.n-ttl{font-size:13px;color:var(--tx);line-height:1.45;margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.n-ttl.bold{font-weight:500;}
.n-chips{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:3px;}
.n-chip{font-size:9px;padding:1px 5px;border-radius:4px;
  background:rgba(255,255,255,.07);color:var(--mu);}
.n-meta{font-size:10px;color:var(--fa);}
.n-empty{padding:50px 20px;text-align:center;color:var(--mu);font-size:13px;line-height:1.8;}
/* 뉴스 모달 */
#n-modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;
  background:var(--bg2);display:none;flex-direction:column;}
#n-modal.open{display:flex;}
#n-modal-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--bg2);border-bottom:1px solid var(--b2);flex-shrink:0;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);}
#n-modal-back{width:36px;height:36px;border-radius:50%;border:1px solid var(--b2);
  background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#n-modal-titles{flex:1;min-width:0;}
#n-modal-src{font-size:10px;color:var(--mu);margin-bottom:2px;}
#n-modal-title{font-size:13px;font-weight:500;color:var(--tx);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
#n-modal-acts{display:flex;gap:6px;flex-shrink:0;}
.n-act-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--b2);
  background:var(--card);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
#n-modal-body{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch;}
.n-modal-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.n-modal-tag{font-size:11px;padding:3px 9px;border-radius:8px;
  background:var(--card);border:1px solid var(--b2);color:var(--tx);}
.n-modal-txt{font-size:14px;color:var(--tx);line-height:1.85;}
.n-modal-en{font-size:12px;color:var(--fa);line-height:1.65;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--b);}
.n-modal-en-lbl{font-size:10px;color:var(--mu);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:5px;}
.n-modal-link{display:inline-block;margin-top:14px;font-size:12px;color:var(--bl);text-decoration:none;}
.n-translating{color:var(--mu);font-size:13px;line-height:1.8;padding:8px 0;}
/* 이벤트 */
.ev-banner{background:var(--gd);border:1px solid var(--gb);border-radius:11px;
  margin:10px 12px;padding:11px 13px;}
.ev-d-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.ev-dday{font-size:22px;font-weight:500;color:var(--gold);font-family:monospace;}
.ev-nm{font-size:13px;font-weight:500;color:var(--tx);}
.ev-sb{font-size:10px;color:var(--mu);margin-top:1px;}
.ev-vals{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px;}
.ev-val{background:rgba(255,255,255,.06);border-radius:7px;padding:5px 6px;text-align:center;}
.ev-vl{font-size:9px;color:var(--mu);margin-bottom:2px;}
.ev-vn{font-size:12px;font-weight:500;font-family:monospace;}
.ev-scs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.ev-sc{border-radius:7px;padding:6px 7px;}
.ev-st{font-size:9px;font-weight:500;margin-bottom:3px;}
.ev-sc-c{font-size:10px;color:var(--tx);line-height:1.45;}
.ev-list{padding:0 12px;}
.ev-row{display:flex;align-items:center;gap:9px;padding:9px 0;
  border-bottom:1px solid var(--b);cursor:pointer;}
.ev-dt{font-size:9px;color:var(--mu);text-align:center;width:28px;flex-shrink:0;line-height:1.4;}
.ev-info{flex:1;}
.ev-rn{font-size:13px;color:var(--tx);}
.ev-rs{font-size:10px;color:var(--mu);margin-top:2px;}
.ev-bd{font-size:9px;padding:3px 8px;border-radius:5px;font-weight:500;white-space:nowrap;}
.eb-n{background:rgba(248,81,73,.12);color:var(--dn);}
.eb-s{background:rgba(245,158,11,.12);color:var(--gold);}
.eb-p{background:rgba(139,148,158,.08);color:var(--mu);}
.eb-d{background:rgba(63,185,80,.12);color:var(--up);}
.ev-body{display:none;padding:8px 0 6px;}
.ev-body.on{display:block;}
.ev-desc{font-size:11px;color:var(--mu);line-height:1.65;margin-bottom:7px;}
/* 분석 */
.an-banner{background:var(--card);border:1px solid var(--b);border-radius:11px;
  margin:10px 12px 8px;padding:10px 13px;display:flex;align-items:flex-start;gap:8px;}
.an-dot{width:9px;height:9px;border-radius:50%;margin-top:3px;flex-shrink:0;}
.an-txt{font-size:12px;color:var(--tx);line-height:1.55;flex:1;}
.an-sec{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;
  color:var(--mu);padding:4px 12px 5px;}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px;margin-bottom:8px;}
.an-c{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:9px 10px;}
.an-cl{font-size:9px;color:var(--mu);margin-bottom:4px;}
.an-cv{font-size:16px;font-weight:500;font-family:monospace;}
.an-cg{font-size:9px;font-family:monospace;margin-top:1px;}
.an-cm{height:22px;margin-top:5px;border-radius:4px;background:rgba(255,255,255,.04);overflow:hidden;}
.an-corr-wrap{padding:0 12px;margin-bottom:8px;}
.an-corr-lbl{font-size:10px;color:var(--mu);margin-bottom:6px;}
.an-cr{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.an-cn{font-size:11px;color:var(--mu);width:75px;flex-shrink:0;}
.an-cb{flex:1;height:5px;background:var(--b2);border-radius:3px;overflow:hidden;}
.an-cf{height:100%;border-radius:3px;}
.an-cv2{font-size:10px;font-family:monospace;width:34px;text-align:right;flex-shrink:0;}
.an-pos{margin:0 12px 12px;background:var(--card);border:1px solid var(--b);border-radius:10px;padding:10px 12px;}
.an-pl{font-size:11px;color:var(--mu);margin-bottom:6px;}
.an-pb{height:8px;background:var(--b2);border-radius:4px;overflow:hidden;margin-bottom:4px;}
.an-pf{height:100%;border-radius:4px;}
.an-pr{display:flex;justify-content:space-between;align-items:center;}
.an-pv{font-size:13px;font-weight:500;}
.an-pd{font-size:10px;color:var(--mu);}
@keyframes spin2{to{transform:rotate(360deg);}}
.loading-spin{display:inline-block;width:14px;height:14px;border:2px solid var(--b2);
  border-top-color:var(--gold);border-radius:50%;animation:spin2 .7s linear infinite;vertical-align:middle;}
</style>
</head>
<body>
<div id="hdr">
  <div id="hdr-ico">🥇</div>
  <div id="hdr-info">
    <div id="hdr-title">CFD Monitor</div>
    <div id="hdr-sub">v3.1 · 로딩 중...</div>
  </div>
  <button id="hdr-btn" onclick="refresh()">↻</button>
</div>
<div class="wrap">
  <!-- 트리 -->
  <div id="p-tree" class="pane on">
    <div class="banner"><span style="font-size:16px;flex-shrink:0">🔍</span><span id="bnr-txt">분석 중...</span></div>
    <div class="tree-hint">← 좌우 스크롤 · 노드 탭하면 상세</div>
    <div id="tree-scroll"></div>
    <div id="tree-guide" style="margin:10px 12px;background:var(--card);border:1px solid var(--b);border-radius:11px;padding:12px 14px;">
      <div style="font-size:11px;color:var(--mu);margin-bottom:6px;">📖 트리 사용법</div>
      <div style="font-size:12px;color:var(--mu);line-height:1.7;">① 좌→우 스크롤: Lv1(원자재) → 결과(자산)<br>② 노드 탭: 인과체인 + 금 영향 표시<br>③ <span style="color:var(--up);">초록 →+</span> 양의 영향 / <span style="color:var(--dn);">빨강 →−</span> 음의 영향</div>
    </div>
    <div style="height:16px;"></div>
  </div>
  <!-- 용어 -->
  <div id="p-gloss" class="pane">
    <div class="g-search-wrap"><div class="g-search"><span>🔍</span><input id="g-input" type="search" placeholder="지표 검색..." oninput="renderGloss()"></div></div>
    <div class="g-cats" id="g-cats"></div>
    <div id="g-list"></div>
    <div style="height:16px;"></div>
  </div>
  <!-- 뉴스 -->
  <div id="p-news" class="pane">
    <div class="n-filterbar" id="n-filterbar"></div>
    <div class="n-tagbar" id="n-tagbar"></div>
    <div id="n-list"></div>
    <div style="height:16px;"></div>
  </div>
  <!-- 이벤트 -->
  <div id="p-ev" class="pane">
    <div id="ev-banner"></div>
    <div style="font-size:10px;color:var(--mu);padding:6px 12px 3px;text-transform:uppercase;letter-spacing:.06em;">예정 일정</div>
    <div class="ev-list" id="ev-list"></div>
    <div style="height:16px;"></div>
  </div>
  <!-- 분석 -->
  <div id="p-an" class="pane">
    <div class="an-banner"><div class="an-dot" id="an-dot" style="background:var(--mu);"></div><div class="an-txt" id="an-txt">데이터 로딩 중...</div></div>
    <div class="an-sec">📊 지표 현황</div>
    <div class="an-grid" id="an-grid"></div>
    <div class="an-corr-wrap"><div class="an-corr-lbl">🔗 금 상관관계</div><div id="an-corr"></div></div>
    <div class="an-pos" id="an-pos"></div>
    <div style="height:16px;"></div>
  </div>
</div>
<!-- 선택 패널 -->
<div id="sel-panel">
  <div id="sel-topbar">
    <div id="sel-drag"></div>
    <button id="sel-close" onclick="closePanel()">✕</button>
  </div>
  <div id="sel-inner">
    <div id="sel-name"></div>
    <div id="sel-val"></div>
    <div class="sel-label">⚡ 인과 체인 → 금까지</div>
    <div id="sel-chain"></div>
    <div class="sel-label" style="margin-top:6px;">금(XAU)에 미치는 영향</div>
    <div id="sel-impact"></div>
  </div>
</div>
<!-- 뉴스 모달 -->
<div id="n-modal">
  <div id="n-modal-hdr">
    <button id="n-modal-back" onclick="closeModal()">←</button>
    <div id="n-modal-titles">
      <div id="n-modal-src"></div>

async function fetchSym(sym) {
  const bases = ['https://query1.finance.yahoo.com', 'https://query2.finance.yahoo.com'];
  for (const base of bases) {
    try {
      const url = base + '/v8/finance/chart/' + encodeURIComponent(sym) + '?interval=1d&range=5d';
      const r = await fetch(url, {signal: AbortSignal.timeout(8000)});
      if (!r.ok) continue;
      const d = await r.json();
      const m = d.chart.result[0].meta;
      const price = parseFloat(m.regularMarketPrice);
      const prev  = parseFloat(m.chartPreviousClose || m.regularMarketPrice);
      if (!price) continue;
      return {price, prev, hi52: m.fiftyTwoWeekHigh, lo52: m.fiftyTwoWeekLow, ok: true};
    } catch(e) {}
  }
  return {ok: false};
}

async function loadData() {
  const btn = document.getElementById('hdr-btn');
  btn.classList.add('spin');
  const keys = Object.keys(SYMS);
  const results = await Promise.allSettled(keys.map(k => fetchSym(SYMS[k])));
  results.forEach((r, i) => {
    IND[keys[i]] = r.status === 'fulfilled' ? r.value : {ok: false};
  });
  if (IND.tnx && IND.tnx.ok && IND.irx && IND.irx.ok) {
    IND.spr = {price: +(IND.tnx.price - IND.irx.price).toFixed(3), prev: 0, ok: true, derived: true};
  }
  btn.classList.remove('spin');
  const now = new Date().toLocaleTimeString('ko-KR');
  document.getElementById('hdr-sub').textContent = 'v' + VER + ' · ' + now;
  renderBanner();
  renderTree();
  renderAnalysis();
}

function renderBanner() {
  const bull = [], bear = [];
  if (IND.dxy && IND.dxy.ok) { const c = IND.dxy.price - IND.dxy.prev; if (c < -0.3) bull.push('달러↓'); else if (c > 0.3) bear.push('달러↑'); }
  if (IND.tnx && IND.tnx.ok) { const c = IND.tnx.price - IND.tnx.prev; if (c < -0.05) bull.push('금리↓'); else if (c > 0.05) bear.push('금리↑'); }
  if (IND.vix && IND.vix.ok) { if (IND.vix.price > 22) bull.push('VIX↑'); else if (IND.vix.price < 15) bear.push('저VIX'); }
  if (IND.wti && IND.wti.ok) { const c = IND.wti.price - IND.wti.prev; if (c > 2) bull.push('유가↑'); else if (c < -2) bear.push('유가↓'); }
  if (IND.gold && IND.gold.ok) { const c = IND.gold.price - IND.gold.prev; if (c > 15) bull.push('금+$' + c.toFixed(0)); else if (c < -15) bear.push('금-$' + Math.abs(c).toFixed(0)); }
  const sc = bull.length - bear.length;
  let ico, txt;
  if (sc >= 2)       { ico = '🟢'; txt = '매크로 강세 우위 — ' + bull.join('·'); }
  else if (sc <= -2) { ico = '🔴'; txt = '매크로 약세 압력 — ' + bear.join('·'); }
  else if (bull.length && bear.length) { ico = '🟡'; txt = '혼조 — 강세:' + bull.join('·') + ' / 약세:' + bear.join('·'); }
  else               { ico = '⚪'; txt = '특이 신호 없음 — 중립'; }
  document.getElementById('bnr-txt').textContent = ico + ' 오늘의 금 시장: ' + txt;
}

function findChain(startId) {
  if (startId === 'gold') return ['gold'];
  const q = [[startId]], vis = new Set([startId]);
  while (q.length) {
    const p = q.shift(), last = p[p.length - 1];
    for (const [f, t] of EDGES) {
      if (f !== last || vis.has(t)) continue;
      const np = [...p, t];
      if (t === 'gold') return np;
      vis.add(t); q.push(np);
    }
  }
  return null;
}

function fmt(nid, price) {
  if (nid === 'tnx') return price.toFixed(3) + '%';
  if (nid === 'wti') return '$' + price.toFixed(1);
  if (nid === 'dxy') return price.toFixed(2);
  return price.toFixed(2);
}

function renderTree() {
  const wrap = document.getElementById('tree-scroll');
  let html = '';
  LEVELS.forEach((lv, li) => {
    const col = COL[lv.c];
    html += '<div class="lv-col">';
    html += '<div class="lv-hdr" style="background:' + col.f + ';color:' + col.t + ';">' + lv.label + '</div>';
    lv.nodes.forEach(nd => {
      const nc = COL[nd.c];
      const d  = IND[nd.id];
      const isSel = selId === nd.id;
      const dc = DEG[nd.id] || 0;
      let valTxt = '--', chgCol = 'var(--fa)', chgTxt = '';
      if (d && d.ok && !d.derived) {
        const chg = d.price - d.prev;
        chgCol = chg >= 0 ? 'var(--up)' : 'var(--dn)';
        valTxt = fmt(nd.id, d.price);
        chgTxt = (chg >= 0 ? '▲' : '▽') + Math.abs(chg).toFixed(nd.id === 'tnx' ? 3 : 2);
      }
      const star = nd.id === 'fomc' || nd.id === 'gold';
      const brd = star ? 'border:1.5px solid var(--gold);' : 'border-color:' + nc.s + ';';
      html += '<div class="nd' + (isSel ? ' sel' : '') + '" onclick="tapNode(\'' + nd.id + '\')">';
      html += '<div class="nd-ico" style="background:' + nc.f + ';' + brd + '">' + nd.ico;
      if (dc >= 3) html += '<div class="nd-cnt">' + dc + '</div>';
      html += '</div>';
      html += '<div class="nd-lbl" style="color:' + nc.t + ';">' + nd.lbl + '</div>';
      html += '<div class="nd-val" style="color:' + chgCol + ';">' + valTxt + '</div>';
      html += '</div>';
    });
    html += '</div>';
    if (li < LEVELS.length - 1) {
      const nextLv = LEVELS[li + 1];
      const cnt = Math.max(lv.nodes.length, nextLv.nodes.length);
      let col2 = 'rgba(255,255,255,0.2)';
      if (selId) {
        const curHas = lv.nodes.some(n => n.id === selId);
        if (curHas) {
          const e = EDGES.find(([f, t]) => f === selId && nextLv.nodes.some(n => n.id === t));
          if (e) col2 = e[2] > 0 ? '#3FB950' : '#F85149';
        }
        const nextHas = nextLv.nodes.some(n => n.id === selId);
        if (nextHas) {
          const e = EDGES.find(([f, t]) => t === selId && lv.nodes.some(n => n.id === f));
          if (e) col2 = '#F59E0B';
        }
      }
      html += '<div class="lv-gap">';
      for (let i = 0; i < cnt; i++) {
        html += '<svg width="20" height="16" viewBox="0 0 20 16">';
        html += '<line x1="1" y1="8" x2="13" y2="8" stroke="' + col2 + '" stroke-width="2" stroke-linecap="round"/>';
        html += '<polyline points="9,4 15,8 9,12" fill="none" stroke="' + col2 + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
        html += '</svg>';
      }
      html += '</div>';
    }
  });
  wrap.innerHTML = html;
}

function tapNode(nid) {
  if (selId === nid) { closePanel(); return; }
  selId = nid;
  document.getElementById('tree-guide').style.display = 'none';
  renderTree();
  updatePanel(nid);
  const lvIdx = LEVELS.findIndex(lv => lv.nodes.some(n => n.id === nid));
  document.getElementById('tree-scroll').scrollTo({left: lvIdx * 130, behavior: 'smooth'});
}

function closePanel() {
  selId = null;
  document.getElementById('sel-panel').classList.remove('show');
  document.getElementById('tree-guide').style.display = '';
  renderTree();
}

function updatePanel(nid) {
  const nd  = NODE_MAP[nid]; if (!nd) return;
  const g   = GLOSS_DATA.find(x => x.id === nid) || {};
  const col = COL[nd.c];
  const d   = IND[nid];
  // 이름
  document.getElementById('sel-name').innerHTML = '<span style="color:' + col.t + ';">' + (g.name || nd.lbl) + '</span>';
  // 현재값
  let valHtml = '';
  if (d && d.ok && !d.derived) {
    const chg = d.price - d.prev;
    const pct = (chg / d.prev * 100).toFixed(2);
    const cc  = chg >= 0 ? 'var(--up)' : 'var(--dn)';
    const ar  = chg >= 0 ? '▲' : '▽';
    valHtml = '<span style="font-family:monospace;font-size:16px;font-weight:500;">' + fmt(nid, d.price) + '</span> <span style="color:' + cc + ';font-size:12px;">' + ar + Math.abs(pct) + '%</span>';
  } else {
    valHtml = '<span style="color:var(--mu);font-size:12px;">' + (g.freq || '실시간 외') + '</span>';
  }
  document.getElementById('sel-val').innerHTML = valHtml;
  // 인과체인
  const chain = findChain(nid);
  let chainHtml = '';
  if (chain && chain.length > 1) {
    chain.forEach((cid, i) => {
      const cn = NODE_MAP[cid] || {};
      const cc2 = COL[cn.c] || COL.rs;
      chainHtml += '<span class="sc-n" style="background:' + cc2.f + ';color:' + cc2.t + ';" onclick="tapNode(\'' + cid + '\')">' + (cn.ico || '') + ' ' + (cn.lbl || cid) + '</span>';
      if (i < chain.length - 1) {
        const e = EDGES.find(([f, t]) => f === chain[i] && t === chain[i + 1]);
        const ac = e ? (e[2] > 0 ? 'var(--up)' : 'var(--dn)') : 'var(--mu)';
        const sym = e ? (e[2] > 0 ? '→+' : '→−') : '→';
        chainHtml += '<span class="sc-a" style="color:' + ac + ';">' + sym + '</span>';
      }
    });
  } else {
    chainHtml = '<span style="color:var(--mu);font-size:11px;">금과 직접 연결됨</span>';
  }
  document.getElementById('sel-chain').innerHTML = chainHtml;
  // 영향
  document.getElementById('sel-impact').innerHTML =
    '<div class="si si-b">🟢 ' + (g.bull || '강세 데이터 없음') + '</div>' +
    '<div class="si si-s">🔴 ' + (g.bear || '약세 데이터 없음') + '</div>';
  document.getElementById('sel-panel').classList.add('show');
}

const TAG_RULES = [
  {tag:'🥇 금',    kw:['gold','xau','bullion']},

];

const ALL_TAGS = TAG_RULES.map(r => r.tag);
const EXPIRE = {unread:3*86400000, read:15*86400000, saved:Infinity, hidden:86400000};
const BOT_BLOCKED = ['investing.com','bloomberg.com','wsj.com','ft.com'];
const NEWS_DATA_VER = 6;
const BAD_PATTERNS  = ['JavaScript와 쿠키','Enable JavaScript','enable cookies','Just a moment','Cloudflare','Access Denied','쿠키를 활성화'];

let nFilter = 'unread', nActiveTags = [], nModalHash = null, _newsIniting = false;

function lsGet(k, d=null) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v)      { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function lsDel(k)         { try { localStorage.removeItem(k); } catch {} }

function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0; return 'n_' + Math.abs(h).toString(36); }
function dateStr(ts) { return new Date(ts).toISOString().slice(0, 10); }
function today() { return dateStr(Date.now()); }

function checkDataVer() {
  const saved = lsGet('n_dv', 0);
  if (saved < NEWS_DATA_VER) { clearNews(); lsSet('n_dv', NEWS_DATA_VER); }
}
function clearNews() {
  const idx = lsGet('n_idx', {});
  Object.values(idx).flat().forEach(h => lsDel(h));
  lsDel('n_idx'); lsDel('n_last');
}
function cleanBad() {
  const idx = lsGet('n_idx', {});
  Object.values(idx).flat().forEach(h => {
    const a = lsGet(h); if (!a) return;
    let ch = false;
    const isBad = t => t && BAD_PATTERNS.some(p => t.includes(p));
    if (isBad(a.body_ko)) { a.body_ko = ''; a.body_en = ''; a.translated = false; ch = true; }
    if (isBad(a.desc_ko)) { a.desc_ko = ''; ch = true; }
    if (ch) lsSet(h, a);
  });
}
function cleanExpired() {
  const idx = lsGet('n_idx', {}); const now = Date.now(); let ch = false;
  Object.keys(idx).forEach(date => {
    idx[date] = idx[date].filter(h => {
      const a = lsGet(h); if (!a) { ch = true; return false; }
      const exp = EXPIRE[a.status]; const age = now - (a.status_at || a.fetched_at || 0);
      if (exp !== Infinity && age > exp) { lsDel(h); ch = true; return false; }
      return true;
    });
    if (!idx[date].length) { delete idx[date]; ch = true; }
  });
  if (ch) lsSet('n_idx', idx);
}

function saveArt(a) {
  const idx = lsGet('n_idx', {}); const d = a.date || today();
  if (!idx[d]) idx[d] = [];
  if (!idx[d].includes(a.hash)) idx[d].push(a.hash);
  lsSet('n_idx', idx); lsSet(a.hash, a);
}
function setStatus(h, s) {
  const a = lsGet(h); if (!a) return;
  a.status = s; a.status_at = Date.now(); lsSet(h, a);
}

function autoTags(txt) {
  const t = txt.toLowerCase();
  return TAG_RULES.filter(r => r.kw.some(k => t.includes(k))).map(r => r.tag);
}

async function translate(text) {
  if (!text || text.length < 4) return '';
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=' + encodeURIComponent(text.slice(0, 600));
    const r = await fetch(url, {signal: AbortSignal.timeout(5000)});
    const d = await r.json();
    return (d[0] || []).map(s => s[0]).join('');
  } catch { return ''; }
}

async function fetchRSS(src) {
  try {
    const api = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(src.url);
    const r = await fetch(api, {signal: AbortSignal.timeout(12000)});
    const d = await r.json();
    if (d.status !== 'ok' || !d.items || !d.items.length) return [];
    return d.items.map(it => ({
      url:     it.link || '#',
      title:   (it.title || '').trim(),
      desc:    (it.description || it.content || '').replace(/<[^>]+>/g, ' ').trim().slice(0, 300),
      pubDate: it.pubDate || '',
      source:  src.label,
    })).filter(it => it.title.length > 8);
  } catch { return []; }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function collectNews() {
  const existing = new Set(Object.values(lsGet('n_idx', {})).flat());
  const newArts = [];
  const fetched = await Promise.allSettled(NEWS_SOURCES.map(src => fetchRSS(src)));
  fetched.forEach((res, i) => {
    if (res.status !== 'fulfilled') return;
    const src = NEWS_SOURCES[i];
    res.value.forEach(it => {
      const hash = hashStr(it.url + it.title);
      if (existing.has(hash)) return;
      let dateVal = today();
      try { if (it.pubDate) dateVal = dateStr(new Date(it.pubDate)); } catch {}
      const a = {
        hash, url: it.url, title: it.title.trim(), title_ko: '',
        desc: it.desc, desc_ko: '', body_en: '', body_ko: '',
        tags: autoTags(it.title + ' ' + it.desc),
        source: src.label, date: dateVal, pubDate: it.pubDate,
        fetched_at: Date.now(), status: 'unread', status_at: Date.now(), translated: false,
      };
      saveArt(a); existing.add(hash); newArts.push(a);
    });
  });
  // 병렬 제목 번역
  const BATCH = 5;
  for (let i = 0; i < newArts.length; i += BATCH) {
    const batch = newArts.slice(i, i + BATCH);
    await Promise.all(batch.map(async a => {
      const ko = await translate(a.title);
      if (ko) { a.title_ko = ko; lsSet(a.hash, a); }
    }));
    if (document.getElementById('p-news').classList.contains('on')) renderNewsList();
    await delay(200);
  }
  lsSet('n_last', Date.now());
  return newArts.length;
}

let bgRunning = false;
async function bgTranslate() {
  if (bgRunning) return; bgRunning = true;
  const idx = lsGet('n_idx', {});
  const hashes = Object.values(idx).flat();
  // desc 번역
  const needDesc = hashes.map(h => lsGet(h)).filter(a => a && !a.translated && a.desc && !a.desc_ko && a.status !== 'hidden');
  for (let i = 0; i < needDesc.length; i += 4) {
    const batch = needDesc.slice(i, i + 4);
    await Promise.all(batch.map(async a => {
      a.desc_ko = await translate(a.desc);
      lsSet(a.hash, a);
    }));
    await delay(300);
  }
  // 본문 스크래핑 (허용 사이트)
  for (const h of hashes) {
    const a = lsGet(h);
    if (!a || a.translated || a.status === 'hidden') continue;
    if (!BOT_BLOCKED.some(d => a.url.includes(d))) {
      try {
        const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(a.url);
        const r = await fetch(proxy, {signal: AbortSignal.timeout(12000)});
        const d = await r.json();
        const raw = d.contents || '';
        const lower = raw.toLowerCase();
        const blocked = BAD_PATTERNS.some(p => lower.includes(p.toLowerCase()));
        if (!blocked && raw.length > 500) {
          let txt = raw.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s{2,}/g,' ').trim();
          const sents = txt.split(/(?<=[.!?])\s+/).filter(s => s.length > 40 && s.length < 500);
          const body_en = sents.slice(0, 20).join(' ').slice(0, 3000);
          if (body_en.length > 100) {
            a.body_en = body_en;
            // 청크 번역
            const chunks = [];
            for (let ci = 0; ci < body_en.length; ci += 600) chunks.push(body_en.slice(ci, ci + 600));
            const parts = [];
            for (const chunk of chunks) { parts.push(await translate(chunk)); await delay(200); }
            a.body_ko = parts.join(' ');
          }
        }
      } catch {}
    }
    a.translated = true; lsSet(a.hash, a);
    if (nModalHash === a.hash && document.getElementById('n-modal').classList.contains('open')) openArticle(a.hash);
    await delay(300);
  }
  if (document.getElementById('p-news').classList.contains('on')) renderNewsList();
  bgRunning = false;
}

function getCounts() {
  cleanExpired();
  const all = Object.values(lsGet('n_idx', {})).flat().map(h => lsGet(h)).filter(Boolean);
  return {
    unread: all.filter(a => a.status === 'unread').length,
    read:   all.filter(a => a.status === 'read').length,
    saved:  all.filter(a => a.status === 'saved').length,
    all:    all.filter(a => a.status !== 'hidden').length,
  };
}

function getArticles() {
  cleanExpired();
  const idx = lsGet('n_idx', {});
  let arts = Object.keys(idx).sort().reverse().flatMap(d => idx[d].map(h => lsGet(h)).filter(Boolean));
  arts = arts.filter(a => a.status !== 'hidden');
  if (nFilter === 'unread') arts = arts.filter(a => a.status === 'unread');
  else if (nFilter === 'saved') arts = arts.filter(a => a.status === 'saved');
  else if (nFilter === 'read') arts = arts.filter(a => a.status === 'read');
  if (nActiveTags.length) arts = arts.filter(a => nActiveTags.every(t => a.tags.includes(t)));
  return arts;
}

function timeAgo(s) {
  if (!s) return '';
  const m = (Date.now() - new Date(s)) / 60000;
  if (m < 1) return '방금'; if (m < 60) return Math.floor(m) + '분 전';
  if (m < 1440) return Math.floor(m / 60) + '시간 전'; return Math.floor(m / 1440) + '일 전';
}

function renderNewsFilters() {
  const c = getCounts();
  const filters = [
    {id:'unread',lbl:'🔵 안읽음', cnt:c.unread},
    {id:'all',   lbl:'전체',      cnt:c.all},
    {id:'saved', lbl:'⭐ 저장됨', cnt:c.saved},
    {id:'read',  lbl:'읽음',      cnt:c.read},
  ];
  document.getElementById('n-filterbar').innerHTML = filters.map(f =>
    '<button class="n-fbtn' + (nFilter === f.id ? ' on' : '') + '" onclick="setNFilter(\'' + f.id + '\')">' + f.lbl + '<span class="n-cnt">' + f.cnt + '</span></button>'
  ).join('');
  document.getElementById('n-tagbar').innerHTML = ALL_TAGS.map(t =>
    '<button class="n-tag-btn' + (nActiveTags.includes(t) ? ' on' : '') + '" onclick="toggleNTag(\'' + t.replace(/'/g,"\\'") + '\')">' + t + '</button>'
  ).join('');
}

function setNFilter(f) { nFilter = f; renderNewsList(); }
function toggleNTag(t) {
  if (nActiveTags.includes(t)) nActiveTags = nActiveTags.filter(x => x !== t);
  else nActiveTags.push(t);
  renderNewsList();
}

function renderNewsList() {
  renderNewsFilters();
  const arts = getArticles();
  const el = document.getElementById('n-list');
  if (!arts.length) {
    el.innerHTML = '<div class="n-empty">' + (nFilter === 'unread' ? '📭 안읽은 기사가 없어요.<br><br>상단 ↻ 버튼으로 뉴스를 수집해보세요.' : nFilter === 'saved' ? '⭐ 저장한 기사가 없어요.' : '기사가 없어요.') + '</div>';
    return;
  }
  const byDate = {};
  arts.forEach(a => { if (!byDate[a.date]) byDate[a.date] = []; byDate[a.date].push(a); });
  const todayStr = today();
  let html = '';
  Object.keys(byDate).sort().reverse().forEach(d => {
    const lbl = d === todayStr ? '오늘' : d.slice(5).replace('-', '/');
    html += '<div class="n-divider">' + lbl + ' · ' + byDate[d].length + '건</div>';
    byDate[d].forEach(a => {
      const isSaved = a.status === 'saved', isRead = a.status === 'read';
      const statusHtml = isSaved ? '<span class="n-star-ico">⭐</span>' : !isRead ? '<div class="n-dot"></div>' : '';
      const chips = (a.tags || []).slice(0, 3).map(t => '<span class="n-chip">' + t + '</span>').join('');
      html += '<div class="n-row' + (isRead && !isSaved ? ' read' : '') + '" onclick="openArticle(\'' + a.hash + '\')">';
      html += '<div class="n-status">' + statusHtml + '</div>';
      html += '<div class="n-body">';
      html += '<div class="n-ttl' + (!isRead ? ' bold' : '') + '">' + (a.title_ko || a.title) + '</div>';
      if (chips) html += '<div class="n-chips">' + chips + '</div>';
      html += '<div class="n-meta">' + a.source + ' · ' + timeAgo(a.pubDate) + (!a.translated ? ' · <span class="loading-spin"></span>' : '') + '</div>';
      html += '</div></div>';
    });
  });
  el.innerHTML = html;
  // 스와이프
  el.querySelectorAll('.n-row').forEach((row, i) => {
    const art = arts[i]; if (!art) return;
    let sx = 0, st = 0;
    row.addEventListener('touchstart', e => { sx = e.touches[0].clientX; st = Date.now(); }, {passive:true});
    row.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx; const dt = Date.now() - st;
      if (Math.abs(dx) < 50 || dt > 400) return;
      if (dx < -50) { setStatus(art.hash, 'hidden'); renderNewsList(); }
      else if (dx > 50) { setStatus(art.hash, art.status === 'saved' ? 'read' : 'saved'); renderNewsList(); }
    }, {passive:true});
  });
}

function openArticle(hash) {
  const a = lsGet(hash); if (!a) return;
  nModalHash = hash;
  if (a.status === 'unread') setStatus(hash, 'read');
  document.getElementById('n-modal').classList.add('open');
  document.getElementById('n-modal-src').textContent = a.source + ' · ' + timeAgo(a.pubDate);
  document.getElementById('n-modal-title').textContent = a.title_ko || a.title;
  document.getElementById('n-modal-star').textContent = a.status === 'saved' ? '⭐' : '☆';
  const tags = (a.tags || []).map(t => '<span class="n-modal-tag">' + t + '</span>').join('');
  const koContent = a.body_ko || a.desc_ko || '';
  const enContent = a.body_en || a.desc || '';
  let bodyHtml = tags ? '<div class="n-modal-tags">' + tags + '</div>' : '';
  if (koContent.length > 10) {
    bodyHtml += '<div class="n-modal-txt">' + koContent + '</div>';
    if (enContent) bodyHtml += '<div class="n-modal-en"><div class="n-modal-en-lbl">원문 (English)</div>' + enContent.slice(0, 800) + '</div>';
  } else if (!a.translated) {
    bodyHtml += '<div class="n-translating"><span class="loading-spin"></span> 번역 진행 중...<br><br>' + (enContent || '') + '</div>';
  } else {
    bodyHtml += '<div class="n-translating">' + (enContent || '내용 없음') + '</div>';
  }
  bodyHtml += '<a class="n-modal-link" href="' + a.url + '" target="_blank">원문 기사 열기 →</a>';
  document.getElementById('n-modal-body').innerHTML = bodyHtml;
  renderNewsList();
}

function closeModal() { document.getElementById('n-modal').classList.remove('open'); nModalHash = null; }
function modalStar() {
  if (!nModalHash) return;
  const a = lsGet(nModalHash); if (!a) return;
  const ns = a.status === 'saved' ? 'read' : 'saved';
  setStatus(nModalHash, ns);
  document.getElementById('n-modal-star').textContent = ns === 'saved' ? '⭐' : '☆';
  renderNewsList();
}
function modalHide() { if (nModalHash) { setStatus(nModalHash, 'hidden'); closeModal(); renderNewsList(); } }

async function initNews() {
  renderNewsList();
  if (_newsIniting) return;
  _newsIniting = true;
  const last = lsGet('n_last', 0);
  if (Date.now() - last > 30 * 60 * 1000 || last === 0) {
    if (getArticles().length === 0) {
      document.getElementById('n-list').innerHTML = '<div class="n-empty">📡 뉴스 수집 중...<br><span style="font-size:11px;color:var(--fa);">Investing.com · Kitco · ForexLive</span></div>';
    }
    await collectNews();
    renderNewsList();
    if (getArticles().length === 0) {
      document.getElementById('n-list').innerHTML = '<div class="n-empty">📭 뉴스를 가져오지 못했어요.<br><button onclick="_newsIniting=false;initNews();" style="margin-top:10px;background:var(--gd);border:1px solid var(--gb);color:var(--gold);padding:8px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;">↻ 다시 시도</button></div>';
    }
  }
  _newsIniting = false;
  setTimeout(bgTranslate, 5000);
}

function renderEvents() {
  const today2 = new Date(); today2.setHours(0,0,0,0);
  const DAY = ['일','월','화','수','목','금','토'];
  const sorted = [...EVENTS].sort((a,b) => new Date(a.date) - new Date(b.date));
  const next = sorted.find(ev => new Date(ev.date) >= today2 && !ev.result);
  if (next) {
    const d = new Date(next.date); const diff = Math.round((d - today2) / 86400000);
    document.getElementById('ev-banner').innerHTML =
      '<div class="ev-banner"><div class="ev-d-row"><div class="ev-dday">D-' + diff + '</div><div><div class="ev-nm">' + next.name + ' ' + next.full + '</div><div class="ev-sb">' + next.date.slice(5,7) + '/' + next.date.slice(8,10) + ' (' + DAY[d.getDay()] + ')</div></div></div>' +
      '<div class="ev-vals"><div class="ev-val"><div class="ev-vl">예상</div><div class="ev-vn" style="color:var(--gold);">' + next.fore + '</div></div><div class="ev-val"><div class="ev-vl">이전</div><div class="ev-vn">' + next.prev + '</div></div><div class="ev-val"><div class="ev-vl">상태</div><div class="ev-vn" style="color:var(--up);">대기</div></div></div>' +
      '<div class="ev-scs"><div class="ev-sc" style="background:rgba(248,81,73,.1);"><div class="ev-st" style="color:var(--dn);">🔥 상회</div><div class="ev-sc-c">' + next.hot + '</div></div><div class="ev-sc" style="background:rgba(63,185,80,.1);"><div class="ev-st" style="color:var(--up);">❄️ 하회</div><div class="ev-sc-c">' + next.cool + '</div></div><div class="ev-sc" style="background:rgba(255,255,255,.05);"><div class="ev-st" style="color:var(--mu);">➡️ 부합</div><div class="ev-sc-c">' + next.inline + '</div></div></div></div>';
  }
  document.getElementById('ev-list').innerHTML = sorted.map((ev, i) => {
    const d = new Date(ev.date); const diff = Math.round((d - today2) / 86400000);
    let bc = 'eb-s', bt = 'D-' + diff;
    if (diff <= 0) bc = 'eb-p', bt = Math.abs(diff) + '일 전';
    else if (diff <= 3) bc = 'eb-n';
    if (ev.result) { bc = 'eb-d'; bt = '완료'; }
    return '<div class="ev-row" onclick="toggleEv(\'evb-' + i + '\')">' +
      '<div class="ev-dt">' + ev.date.slice(5,7) + '/' + ev.date.slice(8,10) + '<br>' + DAY[d.getDay()] + '</div>' +
      '<div class="ev-info"><div class="ev-rn">' + ev.name + ' <span style="color:var(--mu);font-size:11px;">' + ev.full + '</span></div>' +
      '<div class="ev-rs">예상 ' + ev.fore + ' · 이전 ' + ev.prev + (ev.result ? ' · 결과 <b style="color:var(--gold)">' + ev.result + '</b>' : '') + '</div>' +
      '<div class="ev-body" id="evb-' + i + '"><div class="ev-desc">' + ev.desc + '</div></div></div>' +
      '<span class="ev-bd ' + bc + '">' + bt + '</span></div>';
  }).join('');
}

function toggleEv(id) { const el = document.getElementById(id); if (el) el.classList.toggle('on'); }

function renderAnalysis() {
  const d = IND;
  const bull = [], bear = [];
  if (d.dxy && d.dxy.ok) { const c = d.dxy.price - d.dxy.prev; if (c < -0.3) bull.push('달러↓'); else if (c > 0.3) bear.push('달러↑'); }
  if (d.tnx && d.tnx.ok) { const c = d.tnx.price - d.tnx.prev; if (c < -0.05) bull.push('금리↓'); else if (c > 0.05) bear.push('금리↑'); }
  if (d.vix && d.vix.ok) { if (d.vix.price > 22) bull.push('VIX↑'); else if (d.vix.price < 15) bear.push('저VIX'); }
  if (d.wti && d.wti.ok) { const c = d.wti.price - d.wti.prev; if (c > 2) bull.push('유가↑'); else if (c < -2) bear.push('유가↓'); }
  const sc = bull.length - bear.length;
  let dotCol = '#8B949E', sig = '특이 신호 없음 — 중립';
  if (sc >= 2)       { dotCol = '#3FB950'; sig = '강세 우위 — ' + bull.join('·'); }
  else if (sc <= -2) { dotCol = '#F85149'; sig = '약세 압력 — ' + bear.join('·'); }
  else if (bull.length && bear.length) { dotCol = '#F59E0B'; sig = '혼조 — ' + bull.join('·') + ' / ' + bear.join('·'); }
  document.getElementById('an-dot').style.background = dotCol;
  document.getElementById('an-txt').textContent = sig;

  const CARDS = [
    {k:'gold', lbl:'🏅 금 XAU/USD', dec:1},
    {k:'silver',lbl:'🥈 은 XAG/USD', dec:2},
    {k:'dxy',  lbl:'💵 DXY 달러',   dec:2},
    {k:'tnx',  lbl:'📈 10Y 금리',   dec:3},
    {k:'wti',  lbl:'🛢️ WTI 유가',   dec:1},
    {k:'vix',  lbl:'😱 VIX 공포',   dec:2},
  ];
  document.getElementById('an-grid').innerHTML = CARDS.map(({k,lbl,dec}) => {
    const v = d[k];
    if (!v || !v.ok) return '<div class="an-c"><div class="an-cl">' + lbl + '</div><div class="an-cv" style="color:var(--fa);">--</div></div>';
    const chg = v.price - v.prev; const pct = chg / v.prev * 100;
    const cc = chg >= 0 ? 'var(--up)' : 'var(--dn)'; const ar = chg >= 0 ? '▲' : '▽';
    return '<div class="an-c"><div class="an-cl">' + lbl + '</div>' +
      '<div class="an-cv" style="color:' + cc + ';">' + v.price.toFixed(dec) + '</div>' +
      '<div class="an-cg" style="color:' + cc + ';">' + ar + Math.abs(pct).toFixed(2) + '%</div>' +
      '<div class="an-cm"><svg viewBox="0 0 60 22" preserveAspectRatio="none" style="width:100%;height:100%;"><polyline points="' + (chg >= 0 ? '0,18 20,14 40,8 60,4' : '0,4 20,8 40,14 60,18') + '" fill="none" stroke="' + cc + '" stroke-width="1.5" stroke-linecap="round"/></svg></div>' +
      '</div>';
  }).join('');

  const corrData = [{n:'금 vs DXY',v:-0.82},{n:'금 vs 10Y금리',v:-0.74},{n:'금 vs VIX',v:0.58}];
  document.getElementById('an-corr').innerHTML = corrData.map(({n,v}) => {
    const cc = v > 0 ? 'var(--up)' : 'var(--dn)';
    return '<div class="an-cr"><div class="an-cn">' + n + '</div><div class="an-cb"><div class="an-cf" style="width:' + Math.abs(v)*100 + '%;background:' + cc + ';"></div></div><div class="an-cv2" style="color:' + cc + ';">' + v.toFixed(2) + '</div></div>';
  }).join('');

  const vix = d.vix && d.vix.ok ? d.vix.price : null;
  let pct = 75, lvl = '보통', pcol = 'var(--up)', pdesc = '일반적 운용 가능';
  if (vix !== null) {
    if (vix > 35)      { pct=20; lvl='극단 위험'; pcol='var(--dn)'; pdesc='포지션 최소화'; }
    else if (vix > 25) { pct=40; lvl='위험';      pcol='#EF9F27';   pdesc='포지션 축소'; }
    else if (vix > 20) { pct=60; lvl='주의';      pcol='#EF9F27';   pdesc='추가 확대 자제'; }
    else if (vix > 15) { pct=80; lvl='보통';      pcol='var(--up)'; pdesc='일반적 운용 가능'; }
    else               { pct=70; lvl='낙관 주의';  pcol='var(--mu)'; pdesc='풀포지션 지양'; }
  }
  document.getElementById('an-pos').innerHTML =
    '<div class="an-pl">VIX ' + (vix ? vix.toFixed(1) : '--') + ' 기반 권장 포지션</div>' +
    '<div class="an-pb"><div class="an-pf" style="width:' + pct + '%;background:' + pcol + ';"></div></div>' +
    '<div class="an-pr"><div class="an-pv" style="color:' + pcol + ';">' + pct + '% 투입 (' + lvl + ')</div><div class="an-pd">' + pdesc + '</div></div>';
}

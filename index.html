<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>CFD Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0D1117;--bg2:#161B22;--card:#1C2333;
  --b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);
  --tx:#E6EDF3;--mu:#8B949E;--fa:#484F58;
  --gold:#F59E0B;--gd:rgba(245,158,11,.13);--gb:rgba(245,158,11,.35);
  --up:#3FB950;--dn:#F85149;--bl:#58A6FF;
  --HDR:50px;--NAV:56px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-size:14px;}

/* ── 헤더 ── */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--HDR);z-index:100;
  background:rgba(13,17,23,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--b2);display:flex;align-items:center;padding:0 14px;gap:9px;}
#hdr-ico{width:28px;height:28px;border-radius:7px;background:var(--gd);
  border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;font-size:16px;}
#hdr-info{flex:1;min-width:0;}
#hdr-title{font-size:14px;font-weight:500;}
#hdr-sub{font-size:10px;color:var(--mu);margin-top:1px;}
#hdr-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--b2);
  background:var(--bg2);color:var(--mu);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
#hdr-btn.spin{animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}

/* ── 탭 콘텐츠 ── */
.wrap{position:fixed;top:var(--HDR);left:0;right:0;bottom:var(--NAV);overflow:hidden;}
.pane{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;
  display:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  padding-bottom:8px;}
.pane.on{display:block;}

/* ── 하단 네비 ── */
#nav{position:fixed;bottom:0;left:0;right:0;height:var(--NAV);z-index:999;
  background:rgba(13,17,23,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--b2);display:flex;
  padding-bottom:env(safe-area-inset-bottom);}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border:none;background:transparent;color:var(--mu);
  font-size:9px;font-weight:500;cursor:pointer;font-family:inherit;padding:4px 0;}
.nb.on{color:var(--gold);}
.nb-i{font-size:20px;line-height:1.1;}

/* ── 배너 ── */
.banner{background:var(--gd);border:1px solid var(--gb);border-radius:11px;
  margin:10px 12px 6px;padding:10px 13px;display:flex;gap:8px;align-items:flex-start;
  font-size:12px;line-height:1.6;}

/* ── 트리 탭 ── */
.tree-hint{font-size:10px;color:var(--fa);padding:4px 12px 2px;
  display:flex;align-items:center;gap:6px;}
.tree-hint::before{content:'';flex:1;height:1px;background:var(--b);}
.tree-hint::after{content:'';flex:1;height:1px;background:var(--b);}

/* 가로 스크롤 트리 */
#tree-scroll{overflow-x:scroll;overflow-y:visible;
  display:flex;gap:0;padding:8px 8px 4px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;}
#tree-scroll::-webkit-scrollbar{display:none;}

.lv-col{flex-shrink:0;display:flex;flex-direction:column;gap:4px;position:relative;}
.lv-hdr{font-size:8px;font-weight:600;text-align:center;padding:2px 5px;
  border-radius:5px;margin-bottom:2px;white-space:nowrap;letter-spacing:.03em;}

.nd{display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 3px;border-radius:9px;cursor:pointer;width:44px;
  transition:background .12s;position:relative;}
.nd:active{background:rgba(255,255,255,.06);}
.nd.sel{background:rgba(245,158,11,.12);outline:1.5px solid var(--gold);}
.nd-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;border:1px solid transparent;position:relative;}
.nd-lbl{font-size:7px;font-weight:500;text-align:center;line-height:1.2;
  max-width:44px;word-break:keep-all;}
.nd-val{font-size:7px;font-family:monospace;text-align:center;}
.nd-cnt{position:absolute;top:-3px;right:-3px;width:13px;height:13px;
  border-radius:50%;background:var(--bg);border:1px solid rgba(255,255,255,.18);
  font-size:7px;color:var(--mu);display:flex;align-items:center;justify-content:center;
  line-height:1;}

/* 레벨간 화살표 */
.lv-gap{flex-shrink:0;width:22px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;padding-top:26px;gap:8px;}
.lv-gap svg{display:block;flex-shrink:0;}

/* 선택 패널 - 화면 하단 고정 */
#sel-panel{
  position:fixed;bottom:var(--NAV);left:0;right:0;z-index:500;
  background:rgba(22,27,34,.97);backdrop-filter:blur(12px);
  border-top:1.5px solid rgba(245,158,11,.4);
  border-radius:16px 16px 0 0;
  padding:0;
  max-height:48vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  -webkit-overflow-scrolling:touch;
}
#sel-panel.show{transform:translateY(0);}
#sel-topbar{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 6px;position:sticky;top:0;
  background:rgba(22,27,34,.98);border-bottom:1px solid rgba(255,255,255,.06);}
#sel-drag{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);}
#sel-close{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:var(--mu);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#sel-inner{padding:8px 14px 16px;}
#sel-name{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:6px;}
#sel-chain{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:7px;
  padding:7px 9px;background:rgba(255,255,255,.04);border-radius:8px;}
.sc-n{font-size:9px;padding:2px 7px;border-radius:5px;font-weight:500;cursor:pointer;}
.sc-a{font-size:10px;color:var(--fa);}
#sel-impact{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.si{border-radius:7px;padding:6px 8px;font-size:10px;line-height:1.55;}
.si-b{background:rgba(63,185,80,.1);color:var(--up);}
.si-s{background:rgba(248,81,73,.1);color:var(--dn);}

/* ── 용어사전 탭 ── */
.g-search-wrap{padding:8px 12px 5px;}
.g-search{background:var(--card);border:1px solid var(--b2);border-radius:9px;
  padding:7px 11px;display:flex;align-items:center;gap:7px;}
.g-search input{flex:1;background:transparent;border:none;outline:none;
  color:var(--tx);font-size:13px;font-family:inherit;}
.g-search input::placeholder{color:var(--fa);}
.g-cats{display:flex;gap:5px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none;}
.g-cats::-webkit-scrollbar{display:none;}
.g-cat{font-size:10px;padding:4px 11px;border-radius:14px;
  border:1px solid var(--b2);color:var(--mu);white-space:nowrap;
  flex-shrink:0;cursor:pointer;background:transparent;font-family:inherit;}
.g-cat.on{background:var(--gd);border-color:var(--gb);color:var(--gold);}
.g-item{padding:10px 12px;border-bottom:1px solid var(--b);cursor:pointer;}
.g-top{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.g-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;}
.g-name{font-size:13px;font-weight:500;color:var(--tx);flex:1;}
.g-lv{font-size:9px;padding:2px 7px;border-radius:8px;background:var(--b2);color:var(--mu);}
.g-desc{font-size:11px;color:var(--mu);line-height:1.6;margin-left:37px;margin-bottom:4px;}
.g-tags{display:flex;gap:4px;flex-wrap:wrap;margin-left:37px;}
.g-tag{font-size:10px;padding:2px 8px;border-radius:5px;}
.g-tg{background:rgba(63,185,80,.1);color:var(--up);}
.g-tr{background:rgba(248,81,73,.1);color:var(--dn);}
.g-body{display:none;margin-left:37px;margin-top:4px;
  padding:8px 10px;background:rgba(255,255,255,.03);border-radius:7px;
  font-size:11px;color:var(--mu);line-height:1.65;}
.g-body.on{display:block;}

/* ── 뉴스 탭 ── */
.n-cats{display:flex;gap:5px;padding:8px 12px 5px;overflow-x:auto;scrollbar-width:none;}
.n-cats::-webkit-scrollbar{display:none;}
.n-cat{font-size:10px;padding:5px 12px;border-radius:14px;
  border:1px solid var(--b2);color:var(--mu);white-space:nowrap;
  flex-shrink:0;cursor:pointer;background:transparent;font-family:inherit;}
.n-cat.on{background:var(--gd);border-color:var(--gb);color:var(--gold);}
.n-pane{display:none;}.n-pane.on{display:block;}
.n-item{padding:11px 12px;border-bottom:1px solid var(--b);display:flex;gap:9px;cursor:pointer;}
.n-thumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:22px;}
.n-txt{flex:1;min-width:0;}
.n-ko{font-size:12px;color:var(--tx);line-height:1.45;margin-bottom:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.n-en{font-size:10px;color:var(--fa);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.n-meta{display:flex;gap:5px;margin-top:3px;align-items:center;}
.n-tag{font-size:9px;padding:1px 6px;border-radius:4px;background:var(--gd);color:var(--gold);}
.n-src{font-size:9px;color:var(--mu);}
.n-tm{font-size:9px;color:var(--fa);}
.n-detail{display:none;padding:8px 0 4px;border-top:1px solid var(--b);margin-top:8px;}
.n-detail.on{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.n-dlbl{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.n-dtxt{font-size:11px;color:var(--tx);line-height:1.6;}
.n-link{color:var(--bl);font-size:10px;text-decoration:none;display:inline-block;margin-top:5px;}
.n-loading{padding:30px;text-align:center;color:var(--mu);font-size:13px;}
.spin-ico{display:inline-block;animation:rot .7s linear infinite;font-size:20px;}

/* ── 경제이벤트 탭 ── */
.ev-top{margin:10px 12px 0;}
.ev-banner{background:var(--gd);border:1px solid var(--gb);border-radius:11px;padding:11px 13px;margin-bottom:8px;}
.ev-d-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.ev-dday{font-size:22px;font-weight:500;color:var(--gold);font-family:monospace;}
.ev-nm{font-size:13px;font-weight:500;color:var(--tx);}
.ev-sb{font-size:10px;color:var(--mu);margin-top:1px;}
.ev-vals{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px;}
.ev-val{background:rgba(255,255,255,.06);border-radius:7px;padding:5px 6px;text-align:center;}
.ev-vl{font-size:9px;color:var(--mu);margin-bottom:2px;}
.ev-vn{font-size:12px;font-weight:500;font-family:monospace;}
.ev-sc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.ev-sc-box{border-radius:7px;padding:6px 7px;}
.ev-sc-t{font-size:9px;font-weight:500;margin-bottom:3px;}
.ev-sc-c{font-size:10px;line-height:1.45;color:var(--tx);}
.ev-lbl{font-size:10px;color:var(--mu);padding:8px 12px 3px;
  text-transform:uppercase;letter-spacing:.06em;}
.ev-list{padding:0 12px;}
.ev-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--b);cursor:pointer;}
.ev-dt{font-size:9px;color:var(--mu);text-align:center;width:28px;flex-shrink:0;line-height:1.4;}
.ev-info{flex:1;}
.ev-rn{font-size:13px;color:var(--tx);}
.ev-rs{font-size:10px;color:var(--mu);margin-top:2px;}
.ev-bd{font-size:9px;padding:3px 8px;border-radius:5px;font-weight:500;white-space:nowrap;}
.eb-n{background:rgba(248,81,73,.12);color:var(--dn);}
.eb-s{background:rgba(245,158,11,.12);color:var(--gold);}
.eb-p{background:rgba(139,148,158,.08);color:var(--mu);}
.eb-d{background:rgba(63,185,80,.12);color:var(--up);}
.ev-body{display:none;padding:8px 0 6px;margin-left:37px;}
.ev-body.on{display:block;}
.ev-desc{font-size:11px;color:var(--mu);line-height:1.65;margin-bottom:7px;}
.ev-sc2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.ev-s{border-radius:7px;padding:6px 8px;}
.ev-st{font-size:9px;font-weight:500;margin-bottom:3px;}
.ev-sc2 .ev-s .ev-st{color:inherit;}
.ev-sc2 .ev-s p{font-size:10px;color:var(--tx);line-height:1.45;}

/* ── 분석 탭 ── */
.an-banner{background:var(--card);border:1px solid var(--b);border-radius:11px;
  margin:10px 12px 8px;padding:10px 13px;display:flex;align-items:flex-start;gap:8px;}
.an-dot{width:9px;height:9px;border-radius:50%;margin-top:3px;flex-shrink:0;}
.an-txt{font-size:12px;color:var(--tx);line-height:1.55;flex:1;}
.an-sec{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;
  color:var(--mu);padding:4px 12px 5px;}
.an-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px;margin-bottom:8px;}
.an-c{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:9px 10px;}
.an-cl{font-size:9px;color:var(--mu);margin-bottom:4px;display:flex;align-items:center;gap:3px;}
.an-cv{font-size:16px;font-weight:500;font-family:monospace;}
.an-cg{font-size:9px;font-family:monospace;margin-top:1px;}
.an-cm{height:22px;margin-top:5px;border-radius:4px;background:rgba(255,255,255,.04);overflow:hidden;}
.an-corr-wrap{padding:0 12px;margin-bottom:8px;}
.an-corr-lbl{font-size:10px;color:var(--mu);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
.an-cr{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.an-cn{font-size:11px;color:var(--mu);width:75px;flex-shrink:0;}
.an-cb{flex:1;height:5px;background:var(--b2);border-radius:3px;overflow:hidden;}
.an-cf{height:100%;border-radius:3px;}
.an-cv2{font-size:10px;font-family:monospace;width:34px;text-align:right;flex-shrink:0;}
.an-pos{margin:0 12px 12px;background:var(--card);border:1px solid var(--b);border-radius:10px;padding:10px 12px;}
.an-pl{font-size:11px;color:var(--mu);margin-bottom:6px;}
.an-pb{height:8px;background:var(--b2);border-radius:4px;overflow:hidden;margin-bottom:4px;}
.an-pf{height:100%;border-radius:4px;}
.an-pr{display:flex;justify-content:space-between;align-items:center;}
.an-pv{font-size:13px;font-weight:500;}
.an-pd{font-size:10px;color:var(--mu);}
.an-chg-wrap{padding:0 12px;margin-bottom:10px;}
.an-chg-lbl{font-size:10px;color:var(--mu);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
.an-chg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.an-chg-nm{font-size:11px;color:var(--mu);width:75px;flex-shrink:0;}
.an-chg-bw{flex:1;height:5px;background:var(--b2);border-radius:3px;overflow:hidden;}
.an-chg-b{height:100%;border-radius:3px;}
.an-chg-v{font-size:10px;font-family:monospace;width:50px;text-align:right;flex-shrink:0;}

/* ══════════════════════════════════
   뉴스 시스템
══════════════════════════════════ */
/* 상단 필터 바 */
.n-filterbar{display:flex;gap:5px;padding:8px 12px 5px;overflow-x:auto;scrollbar-width:none;align-items:center;}
.n-filterbar::-webkit-scrollbar{display:none;}
.n-fbtn{font-size:10px;padding:4px 11px;border-radius:14px;border:1px solid var(--b2);
  color:var(--mu);white-space:nowrap;flex-shrink:0;cursor:pointer;
  background:transparent;font-family:inherit;transition:all .15s;}
.n-fbtn.on{background:var(--gd);border-color:var(--gb);color:var(--gold);}
.n-fbtn.saved-on{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.35);color:#FFD700;}
.n-count{font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(255,255,255,.1);margin-left:3px;}

/* 태그 필터 */
.n-tagbar{display:flex;gap:4px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none;}
.n-tagbar::-webkit-scrollbar{display:none;}
.n-tag-btn{font-size:10px;padding:3px 9px;border-radius:10px;border:1px solid var(--b);
  color:var(--mu);white-space:nowrap;flex-shrink:0;cursor:pointer;
  background:var(--bg2);font-family:inherit;}
.n-tag-btn.on{background:var(--card);border-color:var(--b2);color:var(--tx);}

/* 기사 목록 */
.n-divider{font-size:10px;color:var(--mu);padding:6px 12px 3px;
  text-transform:uppercase;letter-spacing:.06em;
  border-top:1px solid var(--b);margin-top:2px;}
.n-row{display:flex;align-items:center;padding:10px 12px;
  border-bottom:1px solid var(--b);cursor:pointer;
  transition:background .12s;position:relative;overflow:hidden;
  user-select:none;}
.n-row:active{background:rgba(255,255,255,.04);}
.n-row.read{opacity:.55;}
.n-row.hidden-item{display:none;}

/* 상태 아이콘 */
.n-status{width:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.n-dot{width:7px;height:7px;border-radius:50%;background:var(--bl);flex-shrink:0;}
.n-star{color:#FFD700;font-size:12px;}

/* 태그 칩 */
.n-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;}
.n-chip{font-size:9px;padding:1px 5px;border-radius:5px;
  background:rgba(255,255,255,.07);color:var(--mu);}

/* 기사 제목 */
.n-title{flex:1;min-width:0;}
.n-ttl{font-size:13px;color:var(--tx);line-height:1.4;margin-bottom:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.n-ttl.unread{font-weight:500;}
.n-meta-row{display:flex;align-items:center;gap:5px;}
.n-src{font-size:10px;color:var(--mu);}
.n-tm{font-size:10px;color:var(--fa);}
.n-tl-status{font-size:9px;color:var(--mu);}

/* 스와이프 힌트 */
.n-swipe-hint{position:absolute;right:0;top:0;bottom:0;width:60px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;pointer-events:none;opacity:0;transition:opacity .15s;}
.n-swipe-l{left:0;right:auto;background:rgba(248,81,73,.2);}
.n-swipe-r{background:rgba(255,215,0,.2);}

/* 기사 상세 모달 */
#n-modal{position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.85);backdrop-filter:blur(4px);
  display:none;flex-direction:column;}
#n-modal.open{display:flex;}
#n-modal-inner{background:var(--bg2);flex:1;overflow-y:auto;
  margin-top:env(safe-area-inset-top);
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;}
#n-modal-hdr{display:flex;align-items:center;gap:10px;
  padding:14px 16px 10px;border-bottom:1px solid var(--b);
  position:sticky;top:0;background:var(--bg2);z-index:1;}
#n-modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--b2);
  background:var(--card);color:var(--mu);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#n-modal-title{flex:1;font-size:14px;font-weight:500;color:var(--tx);line-height:1.4;}
#n-modal-actions{display:flex;gap:8px;flex-shrink:0;}
.n-modal-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--b2);
  background:var(--card);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
#n-modal-body{padding:14px 16px 30px;flex:1;}
.n-modal-src{font-size:11px;color:var(--mu);margin-bottom:12px;display:flex;gap:8px;align-items:center;}
.n-modal-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.n-modal-tag{font-size:11px;padding:3px 9px;border-radius:8px;
  background:var(--card);border:1px solid var(--b2);color:var(--tx);}
.n-modal-txt{font-size:14px;color:var(--tx);line-height:1.85;white-space:pre-wrap;}
.n-modal-orig{margin-top:16px;padding-top:12px;border-top:1px solid var(--b);}
.n-modal-orig-lbl{font-size:10px;color:var(--mu);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px;}
.n-modal-en{font-size:12px;color:var(--fa);line-height:1.65;}
.n-modal-link{display:inline-block;margin-top:12px;font-size:12px;
  color:var(--bl);text-decoration:none;}
.n-loading-bar{height:2px;background:var(--gd);
  animation:loading-bar 1.5s ease-in-out infinite;}
@keyframes loading-bar{0%{width:0;opacity:.5}50%{width:70%;opacity:1}100%{width:100%;opacity:.3}}
.n-translating{font-size:12px;color:var(--mu);padding:20px;text-align:center;}
.n-empty{padding:40px 20px;text-align:center;color:var(--mu);font-size:13px;line-height:1.7;}
.n-empty button{margin-top:8px;cursor:pointer;}

/* 액션 메뉴 */
#n-action-menu{position:fixed;bottom:0;left:0;right:0;z-index:900;
  background:var(--bg2);border-top:1px solid var(--b2);
  border-radius:20px 20px 0 0;padding:16px;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);}
#n-action-menu.open{transform:translateY(0);}
.n-menu-title{font-size:13px;color:var(--mu);text-align:center;margin-bottom:14px;}
.n-menu-item{display:flex;align-items:center;gap:12px;padding:13px 6px;
  border-bottom:1px solid var(--b);cursor:pointer;font-size:14px;color:var(--tx);}
.n-menu-item:last-child{border:none;}
.n-menu-ico{font-size:20px;width:30px;text-align:center;}
#n-action-overlay{position:fixed;inset:0;z-index:899;display:none;}
#n-action-overlay.open{display:block;}

<body>

function goTab(t){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('p-'+t).classList.add('on');
  document.getElementById('nb-'+t).classList.add('on');
  if(t==='an') renderAnalysis();
  if(t==='news'){renderNewsList();}
  if(t!=='tree'){
    selId=null;
    document.getElementById('sel-panel').classList.remove('show');
  }
}

async function fetchSym(sym){
  for(const b of['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com']){
    try{
      const r=await fetch(`${b}/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=5d`,
        {signal:AbortSignal.timeout(8000)});
      const d=await r.json();
      const m=d.chart.result[0].meta;
      if(!m.regularMarketPrice) continue;
      return{price:m.regularMarketPrice,prev:m.chartPreviousClose||m.regularMarketPrice,
             hi52:m.fiftyTwoWeekHigh,lo52:m.fiftyTwoWeekLow,ok:true};
    }catch{}
  }
  return{ok:false};
}

async function loadData(){
  const btn=document.getElementById('hdr-btn');
  btn.classList.add('spin');
  const keys=Object.keys(SYMS);
  const res=await Promise.allSettled(keys.map(k=>fetchSym(SYMS[k])));
  res.forEach((r,i)=>{IND[keys[i]]=r.status==='fulfilled'?r.value:{ok:false};});
  if(IND.tnx?.ok&&IND.irx?.ok)
    IND.spr={price:+(IND.tnx.price-IND.irx.price).toFixed(3),prev:0,ok:true,derived:true};
  btn.classList.remove('spin');
  document.getElementById('hdr-sub').textContent=
    '업데이트: '+new Date().toLocaleTimeString('ko-KR')+' · 30분 자동';
  renderBanner();
  renderTree();
  renderAnalysis();
}

function renderBanner(){
  const d=IND, bull=[], bear=[];
  if(d.dxy?.ok){const c=d.dxy.price-d.dxy.prev;if(c<-0.3)bull.push('달러↓');else if(c>0.3)bear.push('달러↑');}
  if(d.tnx?.ok){const c=d.tnx.price-d.tnx.prev;if(c<-0.05)bull.push('금리↓');else if(c>0.05)bear.push('금리↑');}
  if(d.vix?.ok){if(d.vix.price>22)bull.push('VIX↑');else if(d.vix.price<15)bear.push('저VIX');}
  if(d.wti?.ok){const c=d.wti.price-d.wti.prev;if(c>2)bull.push('유가↑');else if(c<-2)bear.push('유가↓');}
  if(d.gold?.ok){const c=d.gold.price-d.gold.prev;if(c>15)bull.push(`금+$${c.toFixed(0)}`);else if(c<-15)bear.push(`금-$${Math.abs(c).toFixed(0)}`);}
  const sc=bull.length-bear.length;
  let ico,txt;
  if(sc>=2){ico='🟢';txt=`매크로 강세 우위 — ${bull.join('·')}${bear.length?' / 경계:'+bear.join('·'):''}`;}
  else if(sc<=-2){ico='🔴';txt=`매크로 약세 압력 — ${bear.join('·')}${bull.length?' / 지지:'+bull.join('·'):''}` ;}
  else if(bull.length&&bear.length){ico='🟡';txt=`혼조 — 강세:${bull.join('·')} / 약세:${bear.join('·')}`;}
  else{ico='⚪';txt='특이 신호 없음 — 중립';}
  document.getElementById('bnr-txt').textContent=ico+' 오늘의 금 시장: '+txt;
}

      const d=IND[nd.id];
      const isSel=selId===nd.id;
      const dc=DEG[nd.id]||0;
      const chg=d?.ok&&!d.derived?d.price-d.prev:null;
      const chgCol=chg!=null?(chg>=0?'var(--up)':'var(--dn)'):'var(--fa)';
      const chgTxt=chg!=null?(chg>=0?'▲':'▽')+Math.abs(chg).toFixed(nd.id==='tnx'?3:1):'--';

        (nd.id==='tnx'?d.price.toFixed(3)+'%':nd.id==='wti'?'$'+d.price.toFixed(1):d.price.toFixed(1))
        :'--';
      const brd=nd.star?`border:1.5px solid var(--gold);`:`border-color:${nc.s};`;
      html+=`<div class="nd${isSel?' sel':''}" onclick="tapNode('${nd.id}')">
        <div class="nd-ico" style="background:${nc.f};${brd}">${nd.ico}
          ${dc>=3?`<div class="nd-cnt">${dc}</div>`:''}
        </div>
        <div class="nd-lbl" style="color:${nc.t};">${nd.lbl}</div>
        <div class="nd-val" style="color:${chgCol};">${valTxt}</div>
      </div>`;
    });
    html+='</div>';
    if(li<LEVELS.length-1){
      const nextLv=LEVELS[li+1];
      const cnt=Math.max(lv.nodes.length,nextLv.nodes.length);
      // 색상 결정
      let col='rgba(255,255,255,0.22)';
      if(selId){
        const curHasSel=lv.nodes.some(n=>n.id===selId);
        if(curHasSel){
          const edges=EDGES.filter(([f,t])=>f===selId&&nextLv.nodes.some(n=>n.id===t));
          if(edges.length) col=edges[0][2]>0?'#3FB950':'#F85149';
        }
        const nextHasSel=nextLv.nodes.some(n=>n.id===selId);
        if(nextHasSel){
          const edges=EDGES.filter(([f,t])=>t===selId&&lv.nodes.some(n=>n.id===f));
          if(edges.length) col='#F59E0B';
        }
      }
      // SVG 화살표
      html+=`<div class="lv-gap">`;
      for(let i=0;i<cnt;i++){
        html+=`<svg width="20" height="16" viewBox="0 0 20 16">
          <line x1="1" y1="8" x2="14" y2="8" stroke="${col}" stroke-width="2" stroke-linecap="round"/>
          <polyline points="10,4 16,8 10,12" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      }
      html+=`</div>`;
    }
  });
  wrap.innerHTML=html;
  if(selId) updateSelPanel(selId);
}

// BFS 인과체인
function findChain(startId){
  if(startId==='gold')return[startId];
  const q=[[startId]],vis=new Set([startId]);
  while(q.length){
    const p=q.shift(),last=p[p.length-1];
    for(const[f,t]of EDGES){
      if(f!==last||vis.has(t))continue;
      const np=[...p,t];
      if(t==='gold')return np;
      vis.add(t);q.push(np);
    }
  }
  return null;
}

  const lvIdx=LEVELS.findIndex(lv=>lv.nodes.some(n=>n.id===nid));

}

// 상태별 보관 기간 (ms)
const EXPIRE = {
  unread: 3  * 86400000,   // 3일
  read:   15 * 86400000,   // 15일 (저장 안 한 것)
  saved:  Infinity,        // 영구
  hidden: 1  * 86400000,   // 1일
};

// ── localStorage 헬퍼 ─────────────────────────
function lsGet(key, def=null){
  try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch{return def;}
}
function lsSet(key, val){
  try{localStorage.setItem(key, JSON.stringify(val));}catch(e){console.warn('ls set err',e);}
}
function lsDel(key){try{localStorage.removeItem(key);}catch{}}

// ── 기사 해시 ─────────────────────────────────
function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){h=(Math.imul(31,h)+s.charCodeAt(i))|0;}
  return 'n_'+Math.abs(h).toString(36);
}

// ── 날짜 유틸 ─────────────────────────────────
function dateStr(ts){return new Date(ts).toISOString().slice(0,10);}
function today(){return dateStr(Date.now());}

// ── 만료 정리 ─────────────────────────────────
function cleanExpired(){
  const idx = lsGet('n_idx', {});
  const now = Date.now();
  let changed = false;
  Object.keys(idx).forEach(date=>{
    idx[date] = idx[date].filter(hash=>{
      const art = lsGet(hash);
      if(!art){lsDel(hash);return false;}
      const exp = EXPIRE[art.status];
      const age = now - (art.status_at||art.fetched_at||0);
      if(exp !== Infinity && age > exp){
        lsDel(hash);changed=true;return false;
      }
      return true;
    });
    if(!idx[date].length){delete idx[date];changed=true;}
  });
  if(changed) lsSet('n_idx', idx);
}

// ── 기사 저장 ─────────────────────────────────
function saveArticle(art){
  const idx = lsGet('n_idx', {});
  const d   = art.date || today();
  if(!idx[d]) idx[d] = [];
  if(!idx[d].includes(art.hash)) idx[d].push(art.hash);
  lsSet('n_idx', idx);
  lsSet(art.hash, art);
}

// ── 기사 상태 변경 ────────────────────────────
function setStatus(hash, status){
  const art = lsGet(hash);
  if(!art) return;
  art.status    = status;
  art.status_at = Date.now();
  lsSet(hash, art);
}

// ── 태그 자동 분석 ────────────────────────────
function autoTags(text){
  const t = text.toLowerCase();
  return TAG_RULES.filter(r=>r.kw.some(k=>t.includes(k))).map(r=>r.tag);
}

// ── 번역 ──────────────────────────────────────
async function translate(text){
  if(!text||text.length<4) return '';
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${encodeURIComponent(text.slice(0,800))}`;
    const r=await fetch(url,{signal:AbortSignal.timeout(8000)});
    const d=await r.json();
    return (d[0]||[]).map(s=>s[0]).join('');
  }catch{return '';}
}

// ── 본문 스크래핑 ─────────────────────────────
async function scrapeBody(url){
  if(!url||url==='#') return '';
  const proxies=[
    `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
  ];
  for(const proxy of proxies){
    try{
      const r=await fetch(proxy,{signal:AbortSignal.timeout(12000)});
      const d=await r.json();
      const raw=d.contents||d.body||'';
      // 태그 제거 + 텍스트 추출
      let txt=raw
        .replace(/<script[\s\S]*?<\/script>/gi,'')
        .replace(/<style[\s\S]*?<\/style>/gi,'')
        .replace(/<[^>]+>/g,' ')
        .replace(/&nbsp;/g,' ')
        .replace(/&amp;/g,'&')
        .replace(/&lt;/g,'<')
        .replace(/&gt;/g,'>')
        .replace(/\s{2,}/g,' ')
        .trim();
      // 의미있는 문장만 추출
      const sents=txt.split(/[.!?]\s+/).filter(s=>s.length>40&&s.length<500);
      return sents.slice(0,30).join('. ').slice(0,5000);
    }catch{}
  }
  return '';
}

// ── 본문 번역 (청크 분할) ─────────────────────
async function translateBody(text){
  if(!text) return '';
  const CHUNK=700;
  const chunks=[];
  for(let i=0;i<text.length;i+=CHUNK) chunks.push(text.slice(i,i+CHUNK));
  const results=[];
  for(const chunk of chunks){
    const ko=await translate(chunk);
    results.push(ko||chunk);
    await delay(300);
  }
  return results.join(' ');
}

// ── RSS 수집 ──────────────────────────────────
async function fetchRSS(src){
  // 1차: rss2json API
  try{
    const api=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}&count=50`;
    const r=await fetch(api,{signal:AbortSignal.timeout(15000)});
    const d=await r.json();
    if(d.status==='ok'&&d.items?.length){
      return d.items.map(it=>({
        url:    it.link||'#',
        title:  (it.title||'').trim(),
        desc:   (it.description||it.content||'').replace(/<[^>]+>/g,' ').trim().slice(0,300),
        pubDate:it.pubDate||'',
        source: src.label,
      })).filter(it=>it.title.length>8);
    }
  }catch{}
  // 2차: allorigins 프록시로 직접 XML 파싱
  try{
    const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(src.url)}`;
    const r=await fetch(proxy,{signal:AbortSignal.timeout(15000)});
    const d=await r.json();
    const xml=d.contents||'';
    const items=[...xml.matchAll(/<item[^>]*>([\s\S]*?)<\/item>/gi)].map(m=>m[1]);
    return items.map(item=>{
      const title=(item.match(/<title>(?:<!\[CDATA\[)?([^\]<]+)/i)||[])[1]?.trim()||'';
      const link= (item.match(/<link>([^<]+)/i)||item.match(/<guid[^>]*>([^<]+)/i)||[])[1]?.trim()||'#';
      const desc= (item.match(/<description>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/description>/i)||[])[1]?.replace(/<[^>]+>/g,' ').trim().slice(0,300)||'';
      const pub=  (item.match(/<pubDate>([^<]+)/i)||[])[1]?.trim()||'';
      return{url:link,title,desc,pubDate:pub,source:src.label};
    }).filter(it=>it.title.length>8);
  }catch{}
  return [];
}

function delay(ms){return new Promise(r=>setTimeout(r,ms));}

// ── 새 기사 수집 + 저장 ───────────────────────
async function collectNews(){
  const existing = new Set(Object.values(lsGet('n_idx',{})).flat());
  let newCount=0;
  for(const src of NEWS_SOURCES){
    const items = await fetchRSS(src);
    for(const it of items){
      const hash = hashStr(it.url+it.title);
      if(existing.has(hash)) continue;
      const tags = autoTags(it.title+' '+it.desc);
      const art = {
        hash,
        url:      it.url,
        title:    it.title,
        title_ko: '',
        desc:     it.desc,
        body_en:  '',
        body_ko:  '',
        tags,
        source:   it.source,
        date:     it.pubDate?dateStr(new Date(it.pubDate)):today(),
        pubDate:  it.pubDate,
        fetched_at: Date.now(),
        status:   'unread',
        status_at: Date.now(),
        translated: false,
      };
      saveArticle(art);
      existing.add(hash);
      newCount++;
      // 제목 즉시 번역
      const ko = await translate(it.title);
      if(ko){ art.title_ko=ko; lsSet(hash,art); }
      await delay(300);
    }
    await delay(500);
  }
  lsSet('n_last_fetch', Date.now());
  return newCount;
}

// ── 백그라운드 본문 번역 ──────────────────────
let bgTranslating = false;
async function bgTranslate(){
  if(bgTranslating) return;
  bgTranslating = true;
  const idx = lsGet('n_idx',{});
  const hashes = Object.values(idx).flat();
  for(const hash of hashes){
    const art = lsGet(hash);
    if(!art||art.translated||art.status==='hidden') continue;
    // 본문 스크래핑
    const body_en = await scrapeBody(art.url);
    art.body_en = body_en;
    if(body_en){
      const body_ko = await translateBody(body_en);
      art.body_ko = body_ko;
    }
    art.translated = true;
    lsSet(hash, art);
    await delay(400);
  }
  bgTranslating = false;
}

// ── 기사 목록 가져오기 ────────────────────────
function getArticles(){
  cleanExpired();
  const idx = lsGet('n_idx',{});
  const dates = Object.keys(idx).sort().reverse();
  let arts = [];
  for(const d of dates){
    for(const hash of idx[d]){
      const art = lsGet(hash);
      if(art) arts.push(art);
    }
  }
  // 상태 필터
  if(nFilter==='unread') arts=arts.filter(a=>a.status==='unread');
  else if(nFilter==='saved') arts=arts.filter(a=>a.status==='saved');
  else if(nFilter==='read') arts=arts.filter(a=>a.status==='read');
  // 숨김은 항상 제외
  arts=arts.filter(a=>a.status!=='hidden');
  // 태그 필터
  if(nActiveTags.length>0)
    arts=arts.filter(a=>nActiveTags.every(t=>a.tags.includes(t)));
  return arts;
}

// ── 상태 카운트 ───────────────────────────────
function getCounts(){
  cleanExpired();
  const idx = lsGet('n_idx',{});
  const all = Object.values(idx).flat().map(h=>lsGet(h)).filter(Boolean);
  return {
    unread: all.filter(a=>a.status==='unread').length,
    read:   all.filter(a=>a.status==='read').length,
    saved:  all.filter(a=>a.status==='saved').length,
    all:    all.filter(a=>a.status!=='hidden').length,
  };
}

// ── 목록 렌더링 ───────────────────────────────
function timeAgo(s){
  if(!s)return'';
  const m=(Date.now()-new Date(s))/60000;
  if(m<1)return'방금';if(m<60)return Math.floor(m)+'분 전';
  if(m<1440)return Math.floor(m/60)+'시간 전';return Math.floor(m/1440)+'일 전';
}

function renderNewsList(){
  renderNewsFilters();
  const arts = getArticles();
  const el = document.getElementById('n-list');
  if(!arts.length){
    el.innerHTML=`<div class="n-empty">
      ${nFilter==='unread'?'📭 안읽은 기사가 없어요.<br><br>아래 탭의 새로고침(↻)으로<br>뉴스를 수집해보세요.':
        nFilter==='saved'?'⭐ 저장한 기사가 없어요.':'기사가 없어요.'}

    return;
  }
  // 날짜별 그룹
  const byDate={};
  arts.forEach(a=>{
    if(!byDate[a.date]) byDate[a.date]=[]; byDate[a.date].push(a);
  });
  const dates=Object.keys(byDate).sort().reverse();
  let html='';
  const todayStr=today();
  dates.forEach(d=>{
    const lbl=d===todayStr?'오늘':d.slice(5).replace('-','/');
    html+=`<div class="n-divider">${lbl} · ${byDate[d].length}건</div>`;
    byDate[d].forEach(art=>{
      const isSaved=art.status==='saved';
      const isRead=art.status==='read';
      const statusIco=isSaved?'<span class="n-star">⭐</span>':
                      !isRead?'<span class="n-dot"></span>':'';
      const tagHtml=art.tags.slice(0,3).map(t=>`<span class="n-chip">${t}</span>`).join('');
      html+=`<div class="n-row${isRead&&!isSaved?' read':''}"
        data-hash="${art.hash}"
        onclick="openArticle('${art.hash}')"
        oncontextmenu="openMenu('${art.hash}',event)">
        <div class="n-status">${statusIco}</div>
        <div class="n-title">
          <div class="n-ttl${!isRead?' unread':''}">${art.title_ko||art.title}</div>
          <div class="n-tags">${tagHtml}</div>
          <div class="n-meta-row">
            <span class="n-src">${art.source}</span>
            <span class="n-tm">· ${timeAgo(art.pubDate)}</span>
            ${art.translated?'':'<span class="n-tl-status">· 번역중</span>'}
          </div>
        </div>
      </div>`;
    });
  });
  el.innerHTML=html;
  // 스와이프 이벤트 등록
  el.querySelectorAll('.n-row').forEach(row=>addSwipe(row));
}

// ── 스와이프 ──────────────────────────────────
function addSwipe(el){
  let sx=0,sy=0,st=0;
  el.addEventListener('touchstart',e=>{
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    const dt=Date.now()-st;
    if(Math.abs(dx)<Math.abs(dy)*1.5||Math.abs(dx)<40) return;
    if(dt>400) return;
    const hash=el.dataset.hash;
    if(dx<-40){
      // 왼쪽: 숨기기
      el.style.transform=`translateX(-100%)`;
      el.style.opacity='0';
      el.style.transition='transform .25s,opacity .25s';
      setTimeout(()=>{setStatus(hash,'hidden');renderNewsList();},250);
    } else if(dx>40){
      // 오른쪽: 저장/해제
      const art=lsGet(hash);
      if(!art)return;
      const ns=art.status==='saved'?'read':'saved';
      el.style.transform=`translateX(30px)`;
      el.style.transition='transform .15s';
      setTimeout(()=>{el.style.transform='';setStatus(hash,ns);renderNewsList();},150);
    }
  },{passive:true});
}

// ── 기사 열기 ─────────────────────────────────
function openArticle(hash){
  const art=lsGet(hash);
  if(!art)return;
  nModalHash=hash;
  // 읽음 처리
  if(art.status==='unread'){setStatus(hash,'read');}
  // 모달 열기
  const modal=document.getElementById('n-modal');
  modal.classList.add('open');
  document.getElementById('n-modal-title').textContent=art.title_ko||art.title;
  document.getElementById('n-modal-star').textContent=art.status==='saved'?'⭐':'☆';

  const body=document.getElementById('n-modal-body');
  const tagHtml=(art.tags||[]).map(t=>`<span class="n-modal-tag">${t}</span>`).join('');
  body.innerHTML=`
    <div class="n-modal-src">
      <span>${art.source}</span>·<span>${timeAgo(art.pubDate)}</span>
    </div>
    ${tagHtml?`<div class="n-modal-tags">${tagHtml}</div>`:''}
    ${art.body_ko
      ?`<div class="n-modal-txt">${art.body_ko}</div>
        ${art.body_en?`<div class="n-modal-orig">
          <div class="n-modal-orig-lbl">원문 (English)</div>
          <div class="n-modal-en">${art.body_en.slice(0,1000)}</div>
        </div>`:''}
        <a class="n-modal-link" href="${art.url}" target="_blank">원문 기사 열기 →</a>`
      :`<div class="n-translating">
          <div class="n-loading-bar" style="margin-bottom:12px;border-radius:2px;"></div>
          본문 번역 중...<br>
          <span style="font-size:11px;color:var(--fa);">백그라운드에서 번역 완료 후 다시 열면 전체 내용이 표시됩니다</span><br><br>
          ${art.desc?`<div style="font-size:13px;color:var(--mu);line-height:1.7;margin-top:8px;">${art.desc}</div>`:''}
          <a class="n-modal-link" href="${art.url}" target="_blank">원문 기사 열기 →</a>
        </div>`}`;
  renderNewsList();
}

function closeModal(){

function modalToggleSave(){
  if(!nModalHash)return;

function modalHide(){

// ── 액션 메뉴 (길게 누르기 대신 contextmenu) ──
function openMenu(hash,e){
  e&&e.preventDefault();
  nMenuHash=hash;
  const art=lsGet(hash);
  document.getElementById('n-menu-title').textContent=
    art?(art.title_ko||art.title).slice(0,30)+'...':'기사 관리';
  document.getElementById('n-action-menu').classList.add('open');
  document.getElementById('n-action-overlay').classList.add('open');
}
function closeActionMenu(){
  document.getElementById('n-action-menu').classList.remove('open');
  document.getElementById('n-action-overlay').classList.remove('open');
}
function menuAction(action){
  if(!nMenuHash)return;
  const art=lsGet(nMenuHash);
  if(!art)return;
  if(action==='save')    setStatus(nMenuHash,'saved');
  if(action==='unsave')  setStatus(nMenuHash,'read');
  if(action==='unread')  setStatus(nMenuHash,'unread');
  if(action==='hide')    setStatus(nMenuHash,'hidden');
  closeActionMenu();
  renderNewsList();
}

// 경제 이벤트

const DAY=['일','월','화','수','목','금','토'];
function renderEvents(){
  const today=new Date();today.setHours(0,0,0,0);
  const sorted=[...EVENTS].sort((a,b)=>new Date(a.date)-new Date(b.date));
  // 배너: 가장 가까운 미래 이벤트
  const next=sorted.find(ev=>new Date(ev.date)>=today&&!ev.result);
  if(next){
    const d=new Date(next.date);
    const diff=Math.round((d-today)/86400000);
    document.getElementById('ev-banner').innerHTML=`
      <div class="ev-banner">
        <div class="ev-d-row">
          <div class="ev-dday">D-${diff}</div>
          <div>
            <div class="ev-nm">${next.name} ${next.full}</div>
            <div class="ev-sb">${next.date.slice(5,7)}/${next.date.slice(8,10)} (${DAY[d.getDay()]}) · ${next.full.includes('FOMC')?'연 8회':'월 1회'}</div>
          </div>
        </div>
        <div class="ev-vals">
          <div class="ev-val"><div class="ev-vl">예상</div><div class="ev-vn" style="color:var(--gold);">${next.fore}</div></div>
          <div class="ev-val"><div class="ev-vl">이전</div><div class="ev-vn">${next.prev}</div></div>
          <div class="ev-val"><div class="ev-vl">상태</div><div class="ev-vn" style="color:var(--up);">대기 중</div></div>
        </div>
        <div class="ev-sc">
          <div class="ev-sc-box" style="background:rgba(248,81,73,.1);">
            <div class="ev-sc-t" style="color:var(--dn);">🔥 상회</div>
            <div class="ev-sc-c">${next.hot}</div>
          </div>
          <div class="ev-sc-box" style="background:rgba(63,185,80,.1);">
            <div class="ev-sc-t" style="color:var(--up);">❄️ 하회</div>
            <div class="ev-sc-c">${next.cool}</div>
          </div>
          <div class="ev-sc-box" style="background:rgba(139,148,158,.07);">
            <div class="ev-sc-t" style="color:var(--mu);">➡️ 부합</div>
            <div class="ev-sc-c">${next.inline}</div>
          </div>
        </div>
      </div>`;
  }
  // 목록
  document.getElementById('ev-list').innerHTML=sorted.map((ev,i)=>{
    const d=new Date(ev.date);
    const diff=Math.round((d-today)/86400000);
    let bc='eb-s',bt=`D-${diff}`;
    if(diff===0){bc='eb-s';bt='TODAY';}
    else if(diff<0){bc='eb-p';bt=`${Math.abs(diff)}일 전`;}
    else if(diff<=3){bc='eb-n';}
    if(ev.result){bc='eb-d';bt='완료';}
    return`<div class="ev-row" onclick="toggleEv('evb-${i}')">
      <div class="ev-dt">${ev.date.slice(5,7)}/${ev.date.slice(8,10)}<br>${DAY[d.getDay()]}</div>
      <div class="ev-info">
        <div class="ev-rn">${ev.name} <span style="color:var(--mu);font-size:11px;">${ev.full}</span></div>
        <div class="ev-rs">예상 ${ev.fore} · 이전 ${ev.prev}${ev.result?' · 결과 <b style="color:var(--gold)">'+ev.result+'</b>':''}</div>
        <div class="ev-body" id="evb-${i}">
          <div class="ev-desc">${ev.desc}</div>
          <div class="ev-sc2">
            <div class="ev-s" style="background:rgba(248,81,73,.08);"><div class="ev-st" style="color:var(--dn);">🔥 상회</div><p>${ev.hot}</p></div>
            <div class="ev-s" style="background:rgba(63,185,80,.08);"><div class="ev-st" style="color:var(--up);">❄️ 하회</div><p>${ev.cool}</p></div>
            <div class="ev-s" style="background:rgba(255,255,255,.04);"><div class="ev-st" style="color:var(--mu);">➡️ 부합</div><p>${ev.inline}</p></div>
          </div>
        </div>
      </div>
      <span class="ev-bd ${bc}">${bt}</span>
    </div>`;
  }).join('');
}

function toggleEv(id){document.getElementById(id)?.classList.toggle('on');}

// 분석 탭

function renderAnalysis(){
  const d=IND;
  const has=Object.values(d).some(v=>v?.ok);
  // 배너
  const bull=[],bear=[];
  if(d.dxy?.ok){const c=d.dxy.price-d.dxy.prev;if(c<-0.3)bull.push('달러↓');else if(c>0.3)bear.push('달러↑');}
  if(d.tnx?.ok){const c=d.tnx.price-d.tnx.prev;if(c<-0.05)bull.push('금리↓');else if(c>0.05)bear.push('금리↑');}
  if(d.vix?.ok){if(d.vix.price>22)bull.push('VIX↑');else if(d.vix.price<15)bear.push('저VIX');}
  if(d.wti?.ok){const c=d.wti.price-d.wti.prev;if(c>2)bull.push('유가↑');else if(c<-2)bear.push('유가↓');}
  const sc=bull.length-bear.length;
  let dotCol,sig;
  if(sc>=2){dotCol='#3FB950';sig=`강세 우위 — ${bull.join('·')}`;}
  else if(sc<=-2){dotCol='#F85149';sig=`약세 압력 — ${bear.join('·')}`;}
  else if(bull.length&&bear.length){dotCol='#F59E0B';sig=`혼조 — 강세:${bull.join('·')} / 약세:${bear.join('·')}`;}
  else{dotCol='#8B949E';sig='특이 신호 없음 — 중립';}
  document.getElementById('an-dot').style.background=dotCol;
  document.getElementById('an-txt').textContent=sig;

  // 지표 그리드
  const CARDS=[
    {k:'gold', lbl:'🏅 금 XAU/USD',   dec:1,pre:'$'},
    {k:'silver',lbl:'🥈 은 XAG/USD',  dec:2,pre:'$'},
    {k:'dxy',  lbl:'💵 DXY 달러',     dec:2,pre:''},
    {k:'tnx',  lbl:'📈 10Y 금리',     dec:3,pre:'',suf:'%'},
    {k:'wti',  lbl:'🛢️ WTI 유가',     dec:1,pre:'$'},
    {k:'vix',  lbl:'😱 VIX 공포',     dec:2,pre:''},
  ];
  document.getElementById('an-grid').innerHTML=CARDS.map(({k,lbl,dec,pre,suf})=>{
    const v=d[k]; if(!v?.ok) return`<div class="an-c"><div class="an-cl">${lbl}</div><div class="an-cv" style="color:var(--fa);">--</div></div>`;
    const chg=v.price-v.prev, pct=chg/v.prev*100;
    const cc=chg>=0?'var(--up)':'var(--dn)';
    const ar=chg>=0?'▲':'▽';
    return`<div class="an-c">
      <div class="an-cl">${lbl}</div>
      <div class="an-cv" style="color:${cc};">${pre}${v.price.toFixed(dec)}${suf||''}</div>
      <div class="an-cg" style="color:${cc};">${ar}${Math.abs(pct).toFixed(2)}%</div>
      <div class="an-cm">
        <svg viewBox="0 0 60 22" preserveAspectRatio="none" style="width:100%;height:100%;">
          <polyline points="${chg>=0?'0,18 15,15 30,12 45,8 60,4':'0,4 15,8 30,12 45,15 60,18'}"
            fill="none" stroke="${cc}" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>`;
  }).join('');

  // 변동 순위
  const ranked=CARDS.filter(c=>d[c.k]?.ok).map(c=>{
    const v=d[c.k];
    return{lbl:c.lbl,pct:Math.abs((v.price-v.prev)/v.prev*100),chg:v.price-v.prev};
  }).sort((a,b)=>b.pct-a.pct);
  const mx=ranked[0]?.pct||1;
  document.getElementById('an-chg').innerHTML=ranked.map(({lbl,pct,chg})=>{
    const col=chg>=0?'var(--up)':'var(--dn)';
    return`<div class="an-chg-row">
      <div class="an-chg-nm">${lbl}</div>
      <div class="an-chg-bw"><div class="an-chg-b" style="width:${(pct/mx*100).toFixed(1)}%;background:${col};"></div></div>
      <div class="an-chg-v" style="color:${col};">${chg>=0?'+':''}${pct.toFixed(2)}%</div>
    </div>`;
  }).join('');

  // 상관관계 (간략 버전)
  const corrData=[
    {label:'금 vs DXY',   val:-0.82,dir:-1},
    {label:'금 vs 10Y금리',val:-0.74,dir:-1},
    {label:'금 vs VIX',   val:+0.58,dir:1},
  ];
  document.getElementById('an-corr').innerHTML=corrData.map(({label,val,dir})=>{
    const col=dir>0?'var(--up)':'var(--dn)';
    return`<div class="an-cr">
      <div class="an-cn">${label}</div>
      <div class="an-cb"><div class="an-cf" style="width:${Math.abs(val)*100}%;background:${col};"></div></div>
      <div class="an-cv2" style="color:${col};">${val.toFixed(2)}</div>
    </div>`;
  }).join('');

  // 포지션 가이드
  const vix=d.vix?.ok?d.vix.price:null;
  let pct=75,lvl='보통',pdesc='중립 구간',pcol='var(--up)';
  if(vix!=null){
    if(vix>35){pct=20;lvl='극단 위험';pdesc='포지션 최소화, 현금 확대';pcol='var(--dn)';}
    else if(vix>25){pct=40;lvl='위험';pdesc='포지션 축소, 손절선 타이트하게';pcol='#EF9F27';}
    else if(vix>20){pct=60;lvl='주의';pdesc='적정 포지션 유지, 추가 확대 자제';pcol='#EF9F27';}
    else if(vix>15){pct=80;lvl='보통';pdesc='일반적 포지션으로 운용 가능';pcol='var(--up)';}
    else{pct=70;lvl='낙관 주의';pdesc='과도한 낙관, 풀포지션 지양';pcol='var(--mu)';}
  }
  document.getElementById('an-pos').innerHTML=`
    <div class="an-pl">VIX${vix!=null?' '+vix.toFixed(1):'--'} 기반 권장 포지션</div>
    <div class="an-pb"><div class="an-pf" style="width:${pct}%;background:${pcol};"></div></div>
    <div class="an-pr">
      <div class="an-pv" style="color:${pcol};">${pct}% 투입 가능 (${lvl})</div>
      <div class="an-pd">${pdesc}</div>
    </div>`;
}
